/* ---------- pooled variance ---------- */
RENDER.pooled_var = (card)=>{
  card.appendChild(el(`<h2>Step 4 &mdash; Pooled Variance</h2>`));
  const wrap = el(`<div></div>`);
  wrap.appendChild(stepGuide(`<p class="center muted">Drag SS&#8321; and SS&#8322; from your descriptives table, and df from below.</p>`));
  wrap.appendChild(formulaRef(`s&sup2;<span class="sub">p</span> = ( SS&#8321; + SS&#8322; ) / df`));
  const formula = el(`<div class="formula">s&sup2;<span class="sub">p</span> = ( <span id="a"></span> + <span id="b"></span> ) / <span id="c"></span> = <span id="res"></span></div>`);

  wrap.appendChild(descTableEl());

  wrap.appendChild(pool);
  const btnrow = el(`<div class="btnrow"></div>`);
  wrap.appendChild(btnrow);
  card.appendChild(wrap);

  const filled = {};

  const sb = slotEl('pv_b','?', (id,n)=>handle('b',id,n,'SS_B', state.desc.SS_B));

        formula.querySelector('#res').textContent = fmt(pv);
        const cont = el(`<button class="primary">Continue</button>`);
        cont.addEventListener('click', ()=> goto('se'));

      }
    } else { node.classList.add('wrong'); setTimeout(()=>node.classList.remove('wrong'),300); mark(false); }
  }
};

/* ---------- standard error ---------- */
RENDER.se = (card)=>{
  card.appendChild(el(`<h2>Standard Error of the Difference</h2>`));
  const wrap = el(`<div></div>`);
  wrap.appendChild(stepGuide(`<p class="center muted">Drag s&sup2;<span class="sub">p</span> (below, needed twice) and n&#8321;/n&#8322; from your descriptives table.</p>`));
  wrap.appendChild(formulaRef(`SE = &radic;( s&sup2;<span class="sub">p</span>/n&#8321; + s&sup2;<span class="sub">p</span>/n&#8322; )`));
  const formula = el(`<div class="formula">SE = &radic;( <span id="a"></span> / <span id="b"></span> + <span id="c"></span> / <span id="d"></span> ) = <span id="res"></span></div>`);
  wrap.appendChild(formula);
  wrap.appendChild(descTableEl());
  const pool = el(`<div class="chippool"></div>`);
  pool.appendChild(chipEl('pv1','s²p = '+fmt(state.pooledVar)));
  pool.appendChild(chipEl('pv2','s²p = '+fmt(state.pooledVar)));
  wrap.appendChild(pool);
  const btnrow = el(`<div class="btnrow"></div>`);
  wrap.appendChild(btnrow);
  card.appendChild(wrap);

  const filled = {};
  const map = { a:{exp:'pv1', disp:fmt(state.pooledVar)}, b:{exp:'n_A', disp:state.desc.n_A}, c:{exp:'pv2', disp:fmt(state.pooledVar)}, d:{exp:'n_B', disp:state.desc.n_B} };
  ['a','b','c','d'].forEach(key=>{
    const s = slotEl('se_'+key,'?', (id,node)=>handle(key,id,node));
    formula.querySelector('#'+key).replaceWith(s);
  });

  function handle(key,id,node){
    if(node.classList.contains('filled')) return;
    const conf = map[key];
    if(id===conf.exp){
      node.textContent = conf.disp;
      node.classList.add('filled');
      markUsed(id);
      filled[key]=true; mark(true);
      if(Object.keys(filled).length===4){
        const se = Math.sqrt(state.pooledVar/state.desc.n_A + state.pooledVar/state.desc.n_B);
        state.se = se;
        formula.querySelector('#res').textContent = fmt(se);
        const cont = el(`<button class="primary">Continue</button>`);
        cont.addEventListener('click', ()=> goto('tcalc'));
        btnrow.appendChild(cont);
      }
    } else { node.classList.add('wrong'); setTimeout(()=>node.classList.remove('wrong'),300); mark(false); }
  }
};

/* ---------- t statistic ---------- */
RENDER.tcalc = (card)=>{
  card.appendChild(el(`<h2>Calculate t</h2>`));
  const wrap = el(`<div></div>`);
  wrap.appendChild(stepGuide(`<p class="center muted">Drag M&#8321; and M&#8322; from your descriptives table, and SE from below.</p>`));
  wrap.appendChild(formulaRef(`t = ( M&#8321; &minus; M&#8322; ) / SE`));
  const formula = el(`<div class="formula">t = ( <span id="a"></span> &minus; <span id="b"></span> ) / <span id="c"></span> = <span id="res"></span></div>`);
  wrap.appendChild(formula);
  wrap.appendChild(descTableEl());
  const pool = el(`<div class="chippool"></div>`);
  pool.appendChild(chipEl('SEv','SE = '+fmt(state.se)));
  wrap.appendChild(pool);
  const btnrow = el(`<div class="btnrow"></div>`);
  wrap.appendChild(btnrow);
  card.appendChild(wrap);

  const filled = {};
  const map = { a:{exp:'M_A',disp:fmt(state.desc.M_A)}, b:{exp:'M_B',disp:fmt(state.desc.M_B)}, c:{exp:'SEv',disp:fmt(state.se)} };
  ['a','b','c'].forEach(key=>{
    const s = slotEl('t_'+key,'?', (id,node)=>handle(key,id,node));
    formula.querySelector('#'+key).replaceWith(s);
  });
  function handle(key,id,node){
    if(node.classList.contains('filled')) return;
    const conf = map[key];
    if(id===conf.exp){
      node.textContent = conf.disp;
      node.classList.add('filled');
      markUsed(id);
      filled[key]=true; mark(true);
      if(Object.keys(filled).length===3){
        const t = (state.desc.M_A - state.desc.M_B)/state.se;
        state.tobt = t;
        formula.querySelector('#res').textContent = fmt(t);
        const cont = el(`<button class="primary">Continue: Make a Decision</button>`);
        cont.addEventListener('click', ()=> goto('compare'));
        btnrow.appendChild(cont);
      }
    } else { node.classList.add('wrong'); setTimeout(()=>node.classList.remove('wrong'),300); mark(false); }
  }
};

/* ---------- compare & decide ---------- */
RENDER.compare = (card)=>{
  const sym = state.scenario.statSymbol || 't';
  const t = state.tobt, tc = state.tcrit;
  const scale = 60;
  const mid = 210;
  const x = mid + t*scale;
  const xc1 = mid + tc*scale;
  const xc2 = mid - tc*scale;
  card.appendChild(el(`
    <div>
      <h2>Step 5 &mdash; Compare &amp; Decide</h2>
      <svg viewBox="0 0 420 90" width="100%" height="90">
        <line x1="20" y1="45" x2="400" y2="45" stroke="var(--border)" stroke-width="2"/>
        <line x1="${xc1}" y1="25" x2="${xc1}" y2="65" stroke="var(--bad)" stroke-width="2"/>
        <line x1="${xc2}" y1="25" x2="${xc2}" y2="65" stroke="var(--bad)" stroke-width="2"/>
        <text x="${xc1}" y="20" font-size="11" fill="var(--bad)" text-anchor="middle">+${sym} crit</text>
        <text x="${xc2}" y="20" font-size="11" fill="var(--bad)" text-anchor="middle">&minus;${sym} crit</text>
        <circle cx="${x}" cy="45" r="6" fill="var(--accent)"/>
        <text x="${x}" y="75" font-size="11" fill="var(--accent)" text-anchor="middle">${sym} obt</text>
      </svg>
      <p class="center">|${sym}<span class="sub">obt</span>| = ${fmt(Math.abs(t))} &nbsp;&nbsp; ${sym}<span class="sub">crit</span> = ${fmt(tc)}</p>
      <p class="center muted">If |${sym} obt| exceeds ${sym} critical, the result falls in the rejection region.</p>
    </div>`));
  const shouldReject = Math.abs(t) > tc;
  const wrap = el(`<div></div>`);
  const row = el(`<div class="btnrow"></div>`);
  const fb = el(`<div class="feedback"></div>`);
  const b1 = el(`<button>Reject H₀</button>`);
  const b2 = el(`<button>Fail to Reject H₀</button>`);
  function choose(val){
    const correct = (val==='reject') === shouldReject;
    state.decisionMade = val;
    if(correct){
      mark(true);
      fb.className='feedback good';
      fb.textContent = shouldReject
        ? `Right — ${fmt(Math.abs(t))} exceeds ${fmt(tc)}, so the result falls in the rejection region.`
        : `Right — ${fmt(Math.abs(t))} does not exceed ${fmt(tc)}, so we don't have enough evidence of a difference.`;
      const cont = el(`<button class="primary">Continue</button>`);
      cont.addEventListener('click', ()=> goto('conclusion'));
      row.innerHTML=''; row.appendChild(cont);
    } else {
      mark(false);
      fb.className='feedback bad';
      fb.textContent = `Check the number line again — is the blue dot past either red line?`;
    }
  }
  b1.addEventListener('click', ()=> choose('reject'));
  b2.addEventListener('click', ()=> choose('fail'));
  row.appendChild(b1); row.appendChild(b2);
  wrap.appendChild(row); wrap.appendChild(fb);
  card.appendChild(wrap);
};

/* ---------- conclusion sentence ---------- */
RENDER.conclusion = (card)=>{
  const sc = state.scenario;
  const statNotation = sc.statNotation(state);
  const correctV1 = state.decisionMade==='fail' ? 'ns' : 'sig';
  const correctV2 = state.decisionMade==='fail' ? 'gt' : 'lt';
  card.appendChild(el(`<h2>Write the Conclusion</h2>`));
  const wrap = el(`<div></div>`);
  const sentence = el(`<p class="center" style="font-size:1.05rem; line-height:2;">
    There was <select id="sel1">
      <option value="">— select —</option>
      <option value="sig">a significant</option>
      <option value="ns">no significant</option>
    </select>
    difference in ${sc.conclusionSubject},
    ${statNotation} = ${fmt(state.tobt)}, p
    <select id="sel2">
      <option value="">— select —</option>
      <option value="lt"> &lt; </option>
      <option value="gt"> &gt; </option>
    </select>
    .05.</p>`);
  wrap.appendChild(sentence);
  const fb = el(`<div class="feedback"></div>`);
  wrap.appendChild(fb);
  const btnrow = el(`<div class="btnrow"></div>`);
  const check = el(`<button class="primary">Check Answer</button>`);

    const v2 = wrap.querySelector('#sel2').value;
    if(v1===correctV1 && v2===correctV2){
      mark(true);
      state.conclusion = {sig:v1, p:v2};
      fb.className='feedback good';
      fb.textContent = state.decisionMade==='fail'
        ? 'Correct! Since we failed to reject H₀, there is no significant difference, and p is greater than .05.'
        : 'Correct! Since we rejected H₀, there is a significant difference, and p is less than .05.';
      const cont = el(`<button class="primary">See Summary</button>`);
      cont.addEventListener('click', ()=> goto('summary'));
      btnrow.innerHTML=''; btnrow.appendChild(cont);
    } else {
      mark(false);
      fb.className='feedback bad';
      fb.textContent = 'Think back to your decision in the last step — did we reject or fail to reject H₀? Try again.';
    }
  });
};

/* ---------- summary ---------- */
RENDER.summary = (card)=>{
  const sc = state.scenario;
  const sym = sc.statSymbol || 't';
  const signed = sc.criticalSigned !== false;
  const statNotationHTML = sc.statNotation(state).replace(/^([A-Za-z]+)/, '<em>$1</em>');
  const total = state.correct + state.wrong;
  const decisionText = state.decisionMade==='fail' ? 'Fail to reject H₀' : 'Reject H₀';
  const sigWord = state.decisionMade==='fail' ? 'no significant' : 'a significant';
  const pWord = state.decisionMade==='fail' ? '&gt;' : '&lt;';
  const dfRow = sc.hasDf ? `<tr><td class="muted">df</td><td>${state.dfVal}</td></tr>` : '';

  let isChallengeFinale = false;
  if(challenge && challenge.active){
    if(!state._challengeCounted){ state._challengeCounted = true; challenge.completed++; renderLives(); }
    isChallengeFinale = challenge.completed >= SCENARIO_ORDER.length;
  }
  if(isChallengeFinale){
    launchFireworks({big:true});
    launchAlienCelebration();
  } else {
    launchFireworks();
  }

  card.appendChild(el(`
    <div>
      <h2>Summary</h2>
      <table class="desc-table">
        <tr><td class="muted">Test</td><td>${sc.testFullName}</td></tr>
        <tr><td class="muted">H₀ / H₁</td><td>${sc.hyp.summaryText}</td></tr>
        <tr><td class="muted">&alpha;</td><td>.05 (two-tailed)</td></tr>
        ${dfRow}
        <tr><td class="muted">${sym} critical</td><td>${signed?'&plusmn;':''}${fmt(state.tcrit)}</td></tr>
        <tr><td class="muted">${sym} obtained</td><td>${fmt(state.tobt)}</td></tr>
        <tr><td class="muted">Decision</td><td>${decisionText}</td></tr>
      </table>
      <p class="center" style="margin-top:18px;">There was ${sigWord} difference in ${sc.conclusionSubject}, ${statNotationHTML} = ${fmt(state.tobt)}, <em>p</em> ${pWord} .05.</p>
      <div class="center"><span class="score-tag">${state.correct} / ${total} correct on first try</span></div>
    </div>`));

  if(challenge && challenge.active){
    if(isChallengeFinale){
      challenge.active = false;
      const finalLives = challenge.lives;
      const panel = el(`<div class="center">
        <p style="font-weight:600; margin-top:18px;">Challenge complete &mdash; all six test types cleared with ${finalLives} ${finalLives===1?'life':'lives'} to spare!</p>
      </div>`);

      const boardWrap = el(`<div></div>`);
      function refreshBoard(){
        boardWrap.innerHTML = '';
        boardWrap.appendChild(el(`<h3 style="font-family:var(--font-display); font-size:1.05rem; margin:20px 0 4px; text-align:center;">Leaderboard</h3>`));
        boardWrap.appendChild(el(`<p class="center muted">Loading&hellip;</p>`));
        loadLeaderboard().then(board=>{
          boardWrap.innerHTML = '';
          boardWrap.appendChild(el(`<h3 style="font-family:var(--font-display); font-size:1.05rem; margin:20px 0 4px; text-align:center;">Leaderboard</h3>`));
          boardWrap.appendChild(leaderboardTableEl(board));
        });
      }

      if(!state._leaderboardSubmitted){
        const formRow = el(`<div class="btnrow" style="flex-wrap:wrap;"></div>`);
        const input = document.createElement('input');
        input.type = 'text'; input.maxLength = 30; input.placeholder = 'Add your name to the leaderboard';
        input.style.cssText = 'font-family:var(--font-body); font-size:.95rem; padding:9px 14px; border-radius:9px; border:1px solid var(--border); background:var(--card); color:var(--text); min-width:240px;';
        const addBtn = el(`<button class="primary">Add to Leaderboard</button>`);
        function submit(){
          const name = input.value.trim();
          if(!name){ input.focus(); return; }
          addBtn.disabled = true; addBtn.textContent = 'Saving…';
          saveLeaderboardEntry(name, finalLives).then(()=>{
            state._leaderboardSubmitted = true;
            formRow.remove();
            refreshBoard();
          });
        }
        addBtn.addEventListener('click', submit);
        input.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); submit(); } });
        formRow.appendChild(input); formRow.appendChild(addBtn);
        panel.appendChild(formRow);
      }
      refreshBoard();
      panel.appendChild(boardWrap);
      panel.appendChild(el(`<div class="btnrow"><button class="primary" onclick="Tutor.toMenu()">Back to Menu</button></div>`));
      card.appendChild(panel);
    } else {
      const btnrow = el(`<div class="btnrow"></div>`);
      const next = el(`<button class="primary">Next Challenge Test (${challenge.completed}/6 done)</button>`);
      next.addEventListener('click', ()=> Tutor.nextChallengeTest());
      btnrow.appendChild(next);
      card.appendChild(btnrow);
    }
  } else {
    card.appendChild(el(`
      <div class="btnrow">
        <button class="primary" onclick="Tutor.toMenu()">Choose Another Scenario</button>
        <button onclick="Tutor.restart()">Start Over</button>
      </div>`));
  }
};

/* ---------- challenge over ---------- */
RENDER.challenge_over = (card)=>{
  const n = challenge ? challenge.completed : 0;
  card.appendChild(el(`
    <div>
      <h2>Challenge Over</h2>
      <p class="center">You ran out of lives after completing <strong>${n} of 6</strong> test types.</p>
      <p class="center muted">In Challenge Mode, every wrong answer anywhere along the way costs a life. Review the test types that gave you trouble in Training mode, then give the challenge another shot.</p>
      <div class="btnrow">
        <button class="primary" onclick="Tutor.startChallenge()">Try Challenge Again</button>
        <button onclick="Tutor.toMenu()">Back to Menu</button>
      </div>
    </div>`));
};

/* ---------- init ---------- */
state = freshState();
render();
</script>
</body>
</html>
