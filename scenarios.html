<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Psychology Data Analysis Tutor</title>
<style>
  :root{
    --bg:#f6f4ef; --card:#fffdf9; --text:#26281f; --muted:#726f61;
    --accent:#2f6460; --accent-light:#e4eeec; --good:#3a7a4e; --bad:#a63f31;
    --border:#e3ddd0; --slot:#f4f1e9;
    --font-display:Cambria,"Iowan Old Style","Palatino Linotype",Georgia,serif;
    --font-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-mono:ui-monospace,"Cascadia Code","SF Mono",Consolas,"Liberation Mono",monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#1a1d19; --card:#22251f; --text:#e9e6da; --muted:#a3a08f;
      --accent:#7fc2ba; --accent-light:#243330; --good:#7bc492; --bad:#e08f7f;
      --border:#3a3c31; --slot:#262920; }
  }
  :root[data-theme="dark"]{ --bg:#1a1d19; --card:#22251f; --text:#e9e6da; --muted:#a3a08f;
      --accent:#7fc2ba; --accent-light:#243330; --good:#7bc492; --bad:#e08f7f;
      --border:#3a3c31; --slot:#262920; }
  :root[data-theme="light"]{ --bg:#f6f4ef; --card:#fffdf9; --text:#26281f; --muted:#726f61;
      --accent:#2f6460; --accent-light:#e4eeec; --good:#3a7a4e; --bad:#a63f31;
      --border:#e3ddd0; --slot:#f4f1e9; }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--font-body);
    display:flex; align-items:center; justify-content:center; min-height:100vh; padding:24px;
  }
  #app{width:100%; max-width:min(960px, 96vw);}
  #progress{display:flex; flex-direction:column; align-items:center; gap:8px; margin-bottom:20px;}
  #progress .dots{display:flex; justify-content:center; gap:10px;}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--border); transition:background .25s, transform .25s;}
  .dot.active{background:var(--accent); transform:scale(1.35);}
  .dot.done{background:var(--accent); opacity:.4;}
  #phaselabel{font-family:var(--font-body); font-size:.72rem; text-transform:uppercase; letter-spacing:.09em; color:var(--muted);}
  #card{
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:44px 32px; box-shadow:0 1px 2px rgba(20,20,10,.04), 0 12px 32px rgba(20,20,10,.06);
    min-height:340px; display:flex; flex-direction:column; justify-content:center;
    animation:fadein .25s ease;
  }
  @keyframes fadein{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}
  @media (prefers-reduced-motion: reduce){ #card{animation:none;} .dot{transition:none;} }
  h1{font-family:var(--font-display); font-weight:600; font-size:1.7rem; margin:0 0 12px; text-align:center; text-wrap:balance;}
  h2{font-family:var(--font-display); font-weight:600; font-size:1.3rem; margin:0 0 18px; text-align:center; color:var(--text); text-wrap:balance;}
  p{line-height:1.65; margin:0 0 14px;}
  .muted{color:var(--muted); font-size:.92rem;}
  .center{text-align:center;}
  .btnrow{display:flex; gap:12px; justify-content:center; margin-top:22px; flex-wrap:wrap;}
  button{
    font-family:var(--font-body); font-size:.95rem; font-weight:500; border-radius:9px; border:1px solid var(--border);
    padding:11px 22px; background:var(--card); color:var(--text); cursor:pointer;
    transition:border-color .15s, color .15s, background .15s;
  }
  button:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  button:hover{border-color:var(--accent); color:var(--accent);}
  button.primary{background:var(--accent); color:#fff; border-color:var(--accent);}
  button.primary:hover{opacity:.9; color:#fff;}
  button:disabled{opacity:.4; cursor:not-allowed;}
  button:disabled:hover{border-color:var(--border); color:var(--text);}
  table{border-collapse:collapse; margin:0 auto; font-variant-numeric:tabular-nums;}
  th,td{padding:7px 11px; text-align:center; border-bottom:1px solid var(--border); font-family:var(--font-mono);}
  th{color:var(--muted); font-weight:600; font-size:.78rem; text-transform:uppercase; letter-spacing:.06em; font-family:var(--font-body);}
  .formula{
    font-family:var(--font-mono); font-size:1.15rem; text-align:center; margin:20px 0; display:flex; align-items:center;
    justify-content:center; gap:6px; flex-wrap:wrap; font-variant-numeric:tabular-nums;
  }
  .formula-ref{
    font-family:var(--font-mono); font-size:1.05rem; text-align:center; color:var(--muted);
    margin:2px 0 16px; font-variant-numeric:tabular-nums; letter-spacing:.01em;
  }
  .chippool{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin:18px 0;}
  .chip{
    display:inline-flex; align-items:center; justify-content:center;
    min-width:44px; padding:8px 14px; border-radius:9px; background:var(--accent-light);
    color:var(--accent); border:1px solid transparent; cursor:grab; font-weight:600;
    font-family:var(--font-mono); font-variant-numeric:tabular-nums;
    user-select:none; transition:all .15s;
  }
  .chip.selected{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-light);}
  .chip.used{opacity:.3; cursor:not-allowed; pointer-events:none;}
  .slot{
    display:inline-flex; align-items:center; justify-content:center;
    min-width:52px; min-height:38px; padding:6px 10px; border:2px dashed var(--border);
    border-radius:9px; background:var(--slot); font-weight:600; cursor:pointer; color:var(--muted);
    font-family:var(--font-mono); font-variant-numeric:tabular-nums;
  }
  .slot.hover{border-color:var(--accent);}
  .slot.filled{border-style:solid; border-color:var(--accent); color:var(--text); background:var(--accent-light); cursor:pointer;}
  td.slot{display:table-cell; text-align:center;}
  .slot.wrong{animation:shake .3s;}
  @media (prefers-reduced-motion: reduce){ .slot.wrong{animation:none; box-shadow:0 0 0 2px var(--bad);} }
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}
  td.compute-flash{animation:popFlash .6s ease; color:var(--accent); font-weight:700;}
  @keyframes popFlash{0%{transform:scale(.8); opacity:.15;}55%{transform:scale(1.12); opacity:1;}100%{transform:scale(1); opacity:1;}}
  @media (prefers-reduced-motion: reduce){ td.compute-flash{animation:none;} }
  .feedback{text-align:center; margin-top:16px; font-weight:600; min-height:22px;}
  .feedback.good{color:var(--good);}
  .feedback.bad{color:var(--bad);}
  .result{font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:1.3rem; font-weight:700; text-align:center; color:var(--accent); margin:14px 0;}
  .scenario-box{background:var(--slot); border-radius:10px; padding:20px 24px; margin:16px 0; border:1px solid var(--border);}
  .choice-btn{display:block; width:100%; text-align:left; padding:14px 18px; margin-bottom:10px;}
  .choice-btn:hover{background:var(--accent-light);}
  .lecture-tag{float:right; font-family:var(--font-body); font-size:.7rem; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); background:var(--slot); border:1px solid var(--border); border-radius:20px; padding:3px 10px;}
  .sub{vertical-align:sub; font-size:.75em;}
  .sup{vertical-align:super; font-size:.75em;}
  select{font-family:var(--font-body); font-size:1rem; padding:6px 8px; border-radius:8px; border:1px solid var(--border); background:var(--card); color:var(--text);}
  select:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .desc-table{margin:18px auto;}
  .small{font-size:.85rem;}
  .desc-panel{margin:16px 0;}
  .desc-caption{font-size:.7rem; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); text-align:center; margin-bottom:4px;}
  .tablewrap{display:flex; gap:14px; justify-content:center; flex-wrap:wrap; align-items:flex-start; max-width:100%;}
  .tablewrap > div:not(.desc-panel){min-width:0; flex:1 1 240px;}
  .tablewrap .formula{justify-content:flex-start;}
  .desc-panel table.desc-table{font-size:.78rem; margin:8px auto 0;}
  .desc-panel table.desc-table th, .desc-panel table.desc-table td{padding:4px 8px;}
  .desc-panel .chip{padding:4px 9px; min-width:30px; font-size:.8rem;}
  .tchip{
    display:inline-flex; align-items:center; justify-content:center;
    padding:2px 11px; border-radius:7px; cursor:grab; font-weight:700;
    color:var(--accent); transition:all .15s; border:1px solid transparent;
  }
  .tchip:hover{background:var(--accent-light);}
  .tchip.selected{background:var(--accent-light); border-color:var(--accent);}
  .tchip.used{opacity:.3; cursor:not-allowed; pointer-events:none; color:var(--muted);}
  input.slot{text-align:center; -webkit-appearance:none; appearance:none;}
  input.slot::-webkit-outer-spin-button, input.slot::-webkit-inner-spin-button{-webkit-appearance:none; margin:0;}
  input.slot:focus{outline:none; border-color:var(--accent);}
  #restart{position:fixed; top:18px; right:18px; font-size:.78rem; padding:7px 14px; opacity:.55; font-family:var(--font-body);}
  #restart:hover{opacity:1;}
  #menubtn{position:fixed; top:18px; left:18px; font-size:.78rem; padding:7px 14px; opacity:.55; font-family:var(--font-body); display:none;}
  #menubtn:hover{opacity:1;}
  .score-tag{display:inline-block; background:var(--accent-light); color:var(--accent); padding:4px 12px; border-radius:20px; font-size:.85rem; font-weight:600; margin-top:10px; font-family:var(--font-mono);}
  #livesbar{position:fixed; top:18px; left:18px; display:none; align-items:center; gap:10px; font-family:var(--font-body); font-size:.78rem; color:var(--muted);}
  #livesbar .hearts{font-size:1.05rem; letter-spacing:3px; color:var(--bad); font-family:var(--font-body);}
  #livesbar .hearts .lost{color:var(--border);}
  #hintbar{
    position:fixed; top:60px; left:50%; transform:translateX(-50%); z-index:10;
    max-width:min(520px, 90vw); background:var(--accent-light); color:var(--accent);
    border:1px solid var(--accent); border-radius:10px; padding:10px 18px;
    font-family:var(--font-body); font-size:.85rem; text-align:center; display:none;
    box-shadow:0 4px 16px rgba(20,20,10,.08);
  }
  #scenariotoggle{
    position:fixed; bottom:18px; right:18px; z-index:10; font-size:.78rem; padding:8px 16px;
    opacity:.7; display:none; font-family:var(--font-body);
  }
  #scenariotoggle:hover{opacity:1;}
  #scenariopanel{
    position:fixed; bottom:64px; right:18px; z-index:20; max-width:min(420px, 88vw);
    max-height:60vh; overflow-y:auto; background:var(--card); border:1px solid var(--border);
    border-radius:12px; padding:18px 20px; box-shadow:0 6px 24px rgba(20,20,10,.14); display:none;
  }
  #scenariopanel h3{font-family:var(--font-display); font-size:1.05rem; margin:0 0 10px; font-weight:600;}
  #scenariopanel p{margin:0 0 10px; font-size:.9rem;}
  #scenariopanel p:last-child{margin-bottom:0;}
  #fireworks{position:fixed; inset:0; width:100vw; height:100vh; pointer-events:none; z-index:50; display:none;}
  #alienshow{position:fixed; inset:0; width:100vw; height:100vh; pointer-events:none; z-index:60; overflow:hidden; display:none;}
  .saucer-wrap{position:absolute; top:8vh; left:50%; width:280px; height:220px; margin-left:-140px; animation:saucerShow 7s cubic-bezier(.4,0,.2,1) forwards;}
  @keyframes saucerShow{
    0%   { transform: translate(-160vw, -6vh) rotate(-12deg); opacity:0; }
    8%   { opacity:1; }
    30%  { transform: translate(0, 0) rotate(4deg); opacity:1; }
    36%  { transform: translate(0, -10px) rotate(-2deg); }
    42%  { transform: translate(0, 0) rotate(2deg); }
    48%  { transform: translate(0, -8px) rotate(-1deg); }
    86%  { transform: translate(0, -4px) rotate(1deg); opacity:1; }
    94%  { transform: translate(0, 0) rotate(0deg); opacity:1; }
    100% { transform: translate(160vw, -6vh) rotate(12deg); opacity:0; }
  }
  .saucer-light{animation: saucerBlink 1s ease-in-out infinite;}
  .saucer-light:nth-of-type(2){animation-delay:.15s;}
  .saucer-light:nth-of-type(3){animation-delay:.3s;}
  .saucer-light:nth-of-type(4){animation-delay:.45s;}
  .saucer-light:nth-of-type(5){animation-delay:.6s;}
  @keyframes saucerBlink{0%,100%{opacity:.35;} 50%{opacity:1;}}
  .alien-group{transform-box: fill-box; transform-origin: 50% 100%; animation: alienRise 4.6s ease-in-out 2.1s both;}
  @keyframes alienRise{
    0%   { transform: translateY(34px); opacity:0; }
    14%  { transform: translateY(0); opacity:1; }
    85%  { transform: translateY(0); opacity:1; }
    100% { transform: translateY(34px); opacity:0; }
  }
  .speech-bubble{transform-box: fill-box; transform-origin: 100% 100%; animation: bubblePop 3.2s cubic-bezier(.34,1.56,.64,1) 2.6s both;}
  @keyframes bubblePop{
    0%   { transform: scale(0); opacity:0; }
    18%  { transform: scale(1.12); opacity:1; }
    28%  { transform: scale(1); opacity:1; }
    82%  { transform: scale(1); opacity:1; }
    100% { transform: scale(.85); opacity:0; }
  }
  @media (prefers-reduced-motion: reduce){
    .saucer-wrap, .alien-group, .speech-bubble, .saucer-light{animation:none !important;}
  }
  #accountbar{position:fixed; bottom:18px; left:18px; z-index:10; font-size:.72rem; padding:7px 14px; opacity:.55; font-family:var(--font-body);}
  #accountbar:hover{opacity:1;}
  .modal-overlay{position:fixed; inset:0; background:rgba(20,18,10,.55); z-index:9998; display:flex; align-items:center; justify-content:center; padding:20px;}
  .modal-overlay.hidden{display:none;}
  .modal-card{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:28px 26px 24px; max-width:380px; width:100%; position:relative; box-shadow:0 20px 60px rgba(20,20,10,.25);}
  .modal-close{position:absolute; top:10px; right:12px; background:none; border:none; font-size:22px; color:var(--muted); cursor:pointer; line-height:1; padding:4px;}
  .modal-close:hover{color:var(--text);}
  .modal-title{font-family:var(--font-display); font-weight:600; font-size:1.3rem; margin:0 0 8px; color:var(--text);}
  .modal-sub{font-size:.85rem; color:var(--muted); line-height:1.5; margin:0 0 6px;}
  .auth-form{display:flex; flex-direction:column; gap:5px;}
  .auth-form label{font-family:var(--font-body); font-size:.7rem; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin-top:10px;}
  .auth-form input{font-family:var(--font-body); font-size:.9rem; padding:9px 11px; border-radius:8px; border:1px solid var(--border); background:var(--card); color:var(--text);}
  .auth-form input:focus{outline:none; border-color:var(--accent);}
  .auth-actions{display:flex; gap:10px; margin-top:16px;}
  .auth-actions button{flex:1;}
  .auth-status{font-size:.78rem; margin:10px 0 0; min-height:16px; line-height:1.4;}
  .auth-status.error{color:var(--bad);}
  .auth-status.ok{color:var(--good);}
  .auth-guest-link{display:block; width:100%; text-align:center; margin-top:18px; background:none; border:none; color:var(--muted); font-family:var(--font-body); font-size:.78rem; cursor:pointer; text-decoration:underline;}
  .auth-guest-link:hover{color:var(--text);}
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<button id="restart" onclick="Tutor.restart()">↺ Restart</button>
<button id="menubtn" onclick="Tutor.toMenu()">&#9776; Back to Menu</button>
<button id="accountbar" onclick="Tutor.accountAction()">Guest mode &middot; Sign in</button>
<div id="livesbar"></div>
<div id="hintbar"></div>
<button id="scenariotoggle" onclick="Tutor.toggleScenario()">&#128220; View Scenario</button>
<div id="scenariopanel"></div>
<canvas id="fireworks"></canvas>
<div id="alienshow"></div>
<div id="app">
  <div id="progress"></div>
  <div id="card"></div>
</div>

<div class="modal-overlay hidden" id="authModalOverlay">
  <div class="modal-card">
    <button class="modal-close" onclick="Tutor.closeAuth()">&times;</button>
    <h3 class="modal-title">Save your leaderboard entry</h3>
    <p class="modal-sub">Create an account (or sign in) so your Challenge Mode runs are tied to you across devices. Or skip this &mdash; as a guest you can still add an entry, it just won't be linked to an account.</p>
    <div class="auth-form">
      <label for="authEmail">Email</label>
      <input type="email" id="authEmail" placeholder="you@umail.ucsb.edu" autocomplete="email">
      <label for="authPassword">Password</label>
      <input type="password" id="authPassword" placeholder="At least 6 characters" autocomplete="current-password">
      <div class="auth-actions">
        <button class="primary" id="authSignInBtn">Sign in</button>
        <button id="authSignUpBtn">Create account</button>
      </div>
      <p class="auth-status" id="authStatus"></p>
    </div>
    <button class="auth-guest-link" id="authGuestBtn">Continue as guest &rarr;</button>
  </div>
</div>

<script>
const DATA_INDEP = {
  A: { label: "Music", scores: [7,8,6,9,5] },
  B: { label: "No Music", scores: [5,4,5,4,2] }
};
const DATA_PT = {
  label: "Anxiety Score",
  before: [12,14,10,9,11],
  after:  [8,10,10,9,9]
};
const DATA_OS_T = { label: "Focus Score", scores: [5,6,7,8,9], popValue: 5 };
const DATA_OS_Z = { label: "Reading Score", scores: [3,4,5,6,7], popValue: 6, popSD: 2 };
const DATA_ANOVA = {
  groups: {
    A: { label: "Flashcards", scores: [5,7,7,8,8] },
    B: { label: "Practice Tests", scores: [7,9,10,11,13] },
    C: { label: "Re-reading", scores: [3,4,4,4,5] }
  }
};
const DATA_RM = {
  label: "Words Recalled",
  conditions: {
    silence: { label: "Silence", scores: [11,8,8,8,10] },
    low: { label: "Low Noise", scores: [7,8,6,6,8] },
    high: { label: "High Noise", scores: [6,2,7,4,6] }
  }
};

const SCENARIOS = {
  indep_t: {
    key:'indep_t', enabled:true, startStep:'scenario',
    menuTitle:'Two Independent Groups',
    menuBlurb:'Compare two separate groups of people on one measure.',
    lecture:'7',
    introHTML: `<p><strong>Design:</strong> A researcher wants to know whether listening to music while studying affects quiz performance. She randomly assigns <strong>10 different students</strong> to one of two independent groups: one group studies <strong>with music</strong>, the other studies <strong>in silence</strong>. Afterward, all students take the same 10-point quiz.</p>
      <p><strong>Groups:</strong> Music (n = 5) vs. No Music (n = 5) &mdash; two <em>separate</em> groups of people.</p>
      <p><strong>DV:</strong> Quiz score (0&ndash;10)</p>`,
    decision:{
      correctQ1:'groups',
      q1Hint:"Not quite — think about who the 10 quiz scores belong to. Are they the same students measured twice, or different students in different groups?",
      correctQ2:'2',
      q2Hint:"Count the groups in the scenario again — Music and No Music. That's how many?",
      resultLead:'Two separate groups, each measured once &rarr;',
      testName:'Independent-Samples t-Test',
      afterResult:'hypotheses'
    },
    hyp:{
      symbols:[{id:'mu1',label:'μ₁'},{id:'mu2',label:'μ₂'},{id:'eq',label:'='},{id:'neq',label:'≠'}],
      h0:['mu1','eq','mu2'], h1:['mu1','neq','mu2'],
      explanation:'Correct! H₀: μ₁ = μ₂ (no difference). H₁: μ₁ ≠ μ₂ (a difference exists), two-tailed.',
      summaryText:'μ₁ = μ₂  /  μ₁ ≠ μ₂',
      afterHyp:'alpha'
    },
    afterAlpha:'df',
    statSymbol:'t', hasDf:true,
    statNotation:(s)=>`t(${s.dfVal})`,
    testFullName:'Independent-samples t-test',
    conclusionSubject:'quiz scores between the music and no-music groups'
  },
  paired_t: {
    key:'paired_t', enabled:true, startStep:'pt_scenario',
    menuTitle:'Two Related Scores (Before/After)',
    menuBlurb:'Compare the same people measured twice — before and after a treatment.',
    lecture:'8',
    introHTML: `<p><strong>Design:</strong> A researcher wants to know whether a brief mindfulness training reduces anxiety. She measures the <strong>same 5 students'</strong> anxiety scores <strong>before</strong> training, then measures the <strong>same students again</strong> after two weeks of training.</p>
      <p><strong>Sample:</strong> n = 5 students, each measured <em>twice</em> &mdash; the same people in both conditions.</p>
      <p><strong>DV:</strong> Anxiety score (0&ndash;20, higher = more anxious)</p>`,
    decision:{
      correctQ1:'repeated',
      q1Hint:"Think again about who the anxiety scores belong to — are these the same 5 students measured twice, or different people?",
      correctQ2:'2',
      q2Hint:"Count the time points again — before training and after training. That's how many?",
      resultLead:'One group, measured twice &rarr;',
      testName:'Dependent-Samples t-Test (Paired t)',
      afterResult:'hypotheses'
    },
    hyp:{
      symbols:[{id:'muD',label:'&mu;<span class="sub">D</span>'},{id:'zero',label:'0'},{id:'eq',label:'='},{id:'neq',label:'≠'}],
      h0:['muD','eq','zero'], h1:['muD','neq','zero'],
      explanation:'Correct! H₀: μ<span class="sub">D</span> = 0 (no change). H₁: μ<span class="sub">D</span> ≠ 0 (a change exists), two-tailed.',
      summaryText:'μ_D = 0  /  μ_D ≠ 0',
      afterHyp:'alpha'
    },
    afterAlpha:'pt_df',
    statSymbol:'t', hasDf:true,
    statNotation:(s)=>`t(${s.dfVal})`,
    testFullName:'Dependent-samples (paired) t-test',
    conclusionSubject:'anxiety scores from before training to after training'
  },

let fireworksRAF = null;
function stopFireworks(){
  if(fireworksRAF){ cancelAnimationFrame(fireworksRAF); fireworksRAF = null; }
  const canvas = document.getElementById('fireworks');
  canvas.style.display = 'none';
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}
function launchFireworks(opts){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const big = !!(opts && opts.big);
  const canvas = document.getElementById('fireworks');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  canvas.style.display = 'block';
  const ctx = canvas.getContext('2d');

  const burstCount = big ? (7 + Math.floor(Math.random()*4)) : (3 + Math.floor(Math.random()*3));
  const bursts = [];
  for(let i=0;i<burstCount;i++){
    bursts.push({
      delay: i * (big ? (240 + Math.random()*300) : (280 + Math.random()*380)),
      x: canvas.width * (0.1 + Math.random()*0.8),
      y: canvas.height * (0.12 + Math.random()*0.4),
      hue: Math.floor(Math.random()*360),
      count: big ? (55 + Math.floor(Math.random()*45)) : (36 + Math.floor(Math.random()*36)),
      ring: Math.random() < 0.3,
      fired: false
    });
  }
  let particles = [];
  function spawnBurst(b){
    for(let i=0;i<b.count;i++){
      const angle = (Math.PI*2*i)/b.count + Math.random()*0.25;
      const speed = b.ring ? (3.5 + Math.random()*0.6) : (1.5 + Math.random()*4);
      particles.push({
        x:b.x, y:b.y,
        vx: Math.cos(angle)*speed,
        vy: Math.sin(angle)*speed,
        hue: b.hue + (Math.random()*46 - 23),
        life: 1,
        decay: 0.007 + Math.random()*0.013,
        size: 1.4 + Math.random()*2.2
      });
    }
  }
  const startTime = performance.now();
  function frame(now){
    const elapsed = now - startTime;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    bursts.forEach(b=>{ if(!b.fired && elapsed>=b.delay){ b.fired = true; spawnBurst(b); } });
    particles.forEach(p=>{
      p.x += p.vx; p.y += p.vy;
      p.vy += 0.045; p.vx *= 0.99;
      p.life -= p.decay;
    });
    particles = particles.filter(p=> p.life>0);
    particles.forEach(p=>{
      ctx.beginPath();
      ctx.fillStyle = `hsla(${p.hue}, 90%, 62%, ${Math.max(p.life,0)})`;
      ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
      ctx.fill();
    });
    if(!bursts.every(b=>b.fired) || particles.length>0){
      fireworksRAF = requestAnimationFrame(frame);
    } else {
      stopFireworks();
    }
  }
  fireworksRAF = requestAnimationFrame(frame);
}

const LEADERBOARD_KEY = 'statsTutorLeaderboard';
function loadLocalLeaderboard(){
  try{ return JSON.parse(localStorage.getItem(LEADERBOARD_KEY)) || []; }
  catch(e){ return window.__memoryLeaderboard || []; }
}
function saveLocalLeaderboardEntry(name, lives){
  const board = loadLocalLeaderboard();
  board.push({name: name.slice(0,30), lives, date: Date.now()});
  board.sort((a,b)=> b.lives - a.lives || a.date - b.date);
  try{ localStorage.setItem(LEADERBOARD_KEY, JSON.stringify(board)); }
  catch(e){ window.__memoryLeaderboard = board; }
  return board;
}
async function loadLeaderboard(){
  if(sbClient){
    try{
      const {data, error} = await sbClient.from('challenge_leaderboard')
        .select('name, lives, created_at')
        .order('lives', {ascending:false})
        .order('created_at', {ascending:true})

      if(error) console.error('leaderboard load failed, falling back to local:', error);
    }catch(e){ console.error('leaderboard load failed, falling back to local:', e); }
  }
  return loadLocalLeaderboard();
}

function fmt(n){ return Number.isInteger(n) ? n : Math.round(n*1000)/1000; }
function poss(word){ return word.endsWith('s') ? word+"'" : word+"'s"; }

/* ---------- sampling distribution chart with shaded critical region ---------- */
function distributionChart(kind, criticalValue){
  const W = 400, H = 130, baseline = 106, padX = 22, curveHeight = 82;
  const isF = kind === 'F';
  const domain = isF ? [0, 6] : [-4, 4];
  const xScale = x => padX + (x - domain[0]) / (domain[1]-domain[0]) * (W - 2*padX);

  const pts = [];
  if(isF){
    for(let x=0.02; x<=domain[1]; x+=0.04) pts.push([x, Math.pow(x,1.4)*Math.exp(-1.15*x)]);
  } else {
    for(let x=domain[0]; x<=domain[1]; x+=0.05) pts.push([x, Math.exp(-x*x/2)]);
  }
  const maxY = Math.max(...pts.map(p=>p[1]));
  const toPixel = ([x,y]) => `${xScale(x).toFixed(1)},${(baseline - (y/maxY)*curveHeight).toFixed(1)}`;
  const linePath = 'M ' + pts.map(toPixel).join(' L ');
  const fillPath = linePath + ` L ${xScale(domain[1]).toFixed(1)},${baseline} L ${xScale(domain[0]).toFixed(1)},${baseline} Z`;

  let shadeSvg;
  if(isF){
    const cx = xScale(Math.min(criticalValue, domain[1])).toFixed(1);
    shadeSvg = `
      <clipPath id="clipShadeF"><rect x="${cx}" y="0" width="${W-cx}" height="${H}"/></clipPath>
      <path d="${fillPath}" fill="var(--bad)" fill-opacity=".35" clip-path="url(#clipShadeF)"/>
      <line x1="${cx}" y1="14" x2="${cx}" y2="${baseline}" stroke="var(--bad)" stroke-width="1.5" stroke-dasharray="3,3"/>
      <text x="${cx}" y="11" font-size="11" fill="var(--bad)" text-anchor="middle">F crit</text>`;
  } else {
    const cxPos = xScale(Math.min(criticalValue, domain[1])).toFixed(1);
    const cxNeg = xScale(Math.max(-criticalValue, domain[0])).toFixed(1);
    const sym = kind === 'z' ? 'z' : 't';
    shadeSvg = `
      <clipPath id="clipShadeR"><rect x="${cxPos}" y="0" width="${W-cxPos}" height="${H}"/></clipPath>
      <clipPath id="clipShadeL"><rect x="0" y="0" width="${cxNeg}" height="${H}"/></clipPath>
      <path d="${fillPath}" fill="var(--bad)" fill-opacity=".35" clip-path="url(#clipShadeR)"/>
      <path d="${fillPath}" fill="var(--bad)" fill-opacity=".35" clip-path="url(#clipShadeL)"/>
      <line x1="${cxPos}" y1="14" x2="${cxPos}" y2="${baseline}" stroke="var(--bad)" stroke-width="1.5" stroke-dasharray="3,3"/>
      <line x1="${cxNeg}" y1="14" x2="${cxNeg}" y2="${baseline}" stroke="var(--bad)" stroke-width="1.5" stroke-dasharray="3,3"/>
      <text x="${cxPos}" y="11" font-size="11" fill="var(--bad)" text-anchor="middle">+${sym} crit</text>
      <text x="${cxNeg}" y="11" font-size="11" fill="var(--bad)" text-anchor="middle">&minus;${sym} crit</text>`;
  }
  return el(`<div style="margin:14px 0;">
    <svg viewBox="0 0 ${W} ${H}" width="100%" height="130" style="max-width:420px; display:block; margin:0 auto;">
      <line x1="${padX}" y1="${baseline}" x2="${W-padX}" y2="${baseline}" stroke="var(--border)" stroke-width="1.5"/>
      <path d="${fillPath}" fill="var(--accent-light)"/>
      <path d="${linePath}" fill="none" stroke="var(--accent)" stroke-width="1.8"/>
      ${shadeSvg}
    </svg>
  </div>`);
}

function goto(step){ state.step = step; render(); window.scrollTo(0,0); }

function mark(good){
  if(good){ state.correct++; return; }
  state.wrong++;
  if(challenge && challenge.active){
    challenge.lives--;
    renderLives();
    showHint();
    if(challenge.lives<=0){
      challenge.active=false;
      setTimeout(()=>{ state.step='challenge_over'; render(); window.scrollTo(0,0); }, 500);
    }
  }
}

/* ---------- drag/drop primitives ---------- */
function wireChip(elm, id){
  elm.dataset.id = id;
  elm.draggable = true;
  elm.addEventListener('dragstart', e=>{ e.dataTransfer.setData('text/plain', id); });
  elm.addEventListener('click', ()=>{
    if(elm.classList.contains('used')) return;
    document.querySelectorAll('.selected').forEach(x=>x.classList.remove('selected'));
    elm.classList.add('selected');
    dragSelected = id;
  });
  return elm;
}
function chipEl(id,label){
  return wireChip(el(`<div class="chip">${label}</div>`), id);
}
function markUsed(id){
  document.querySelectorAll(`[data-id="${id}"]`).forEach(e=> e.classList.add('used'));
}
function shake(node){
  node.classList.add('wrong');
  setTimeout(()=> node.classList.remove('wrong'), 300);
}
function wireDrop(elm, onDrop){
  elm.addEventListener('dragover', e=>{ e.preventDefault(); elm.classList.add('hover'); });
  elm.addEventListener('dragleave', ()=> elm.classList.remove('hover'));
  elm.addEventListener('drop', e=>{ e.preventDefault(); elm.classList.remove('hover'); const id2=e.dataTransfer.getData('text/plain'); if(id2) onDrop(id2, elm); });
  elm.addEventListener('click', ()=>{
    if(elm.classList.contains('filled')) return;
    if(dragSelected){ onDrop(dragSelected, elm); dragSelected=null; document.querySelectorAll('.selected').forEach(x=>x.classList.remove('selected')); }
  });
  return elm;
}
function slotEl(id, placeholder, onDrop){
  const s = el(`<div class="slot" data-id="${id}">${placeholder||'?'}</div>`);
  return wireDrop(s, onDrop);
}
function numInput(id, expected, onCorrect){
  const inp = document.createElement('input');
  inp.type = 'text'; inp.inputMode = 'numeric'; inp.autocomplete = 'off';
  inp.className = 'slot'; inp.placeholder = '?'; inp.size = 2; inp.dataset.id = id;
  function check(){
    const raw = inp.value.trim();
    if(raw === '' || inp.disabled) return;
    if(Number(raw) === expected){
      inp.classList.add('filled'); inp.disabled = true; mark(true); onCorrect();
    } else {
      shake(inp); mark(false); inp.select();
    }
  }
  inp.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); check(); } });
  inp.addEventListener('blur', check);
  return inp;
}

  const tbl = el(`<table class="desc-table"><tr><th></th><th>n</th><th>M</th><th>SS</th><th>s&sup2;</th><th>s</th></tr></table>`);

    });

  });
  wrap.appendChild(tbl);
  return wrap;
}

/* ---------- progress dots ---------- */
function renderProgress(){
  const p = document.getElementById('progress');
  const cur = STEP_PHASE[state.step] ?? 0;

  const dots = document.createElement('div');
  dots.className = 'dots';
  PHASES.forEach((_,i)=>{

  });
  const label = document.createElement('div');
  label.id = 'phaselabel';
  label.textContent = PHASES[cur];
  p.appendChild(dots);
  p.appendChild(label);
}

/* ---- sum of squares step: drop the group's scores/mean onto any row of that group to fill the whole block ---- */
RENDER.ss = (card)=>{
  card.appendChild(el(`<h2>Step 2 &mdash; Sum of Squares</h2>`));
  const wrap = document.createElement('div');
  wrap.appendChild(stepGuide(`<p class="center muted">The scores are already filled in below — drag each group's mean onto its M rows to fill the whole group.</p>`));
  wrap.appendChild(formulaRef(`SS = &Sigma;(X &minus; M)&sup2;`));

  const rows = [];
  ['A','B'].forEach(group=>{
    DATA_INDEP[group].scores.forEach(score=>{
      const xTd = document.createElement('td'); xTd.textContent = score; xTd.dataset.value = score;
      const mTd = document.createElement('td'); mTd.className='slot'; mTd.textContent='—';
      const devTd = document.createElement('td'); devTd.className='muted'; devTd.textContent='—';
      const sqTd = document.createElement('td'); sqTd.className='muted'; sqTd.textContent='—';
      rows.push({group, score, xTd, mTd, devTd, sqTd});
    });
  });

  const fb = el(`<div class="feedback"></div>`);
  const mDone = new Set();

  rows.forEach(r=>{
    wireDrop(r.mTd, (id,node)=>{
      const m = id.match(/^M_(A|B)$/);
      if(!m){ shake(node); mark(false); return; }
      const grp = m[1];
      if(mDone.has(grp)) return;
      if(grp !== r.group){
        shake(node); mark(false);
        fb.className='feedback bad';
        fb.textContent = `That's ${DATA_INDEP[grp].label}'s mean — drop it on the ${DATA_INDEP[grp].label} rows instead.`;
        return;
      }
      mDone.add(grp); markUsed(id); mark(true); fb.textContent='';
      rows.filter(rr=>rr.group===grp).forEach(rr=>{ rr.mTd.textContent=fmt(state.desc[`M_${grp}`]); rr.mTd.className='slot filled'; });
      checkReady();
    });
  });

  const tables = el(`<div class="tablewrap"></div>`);
  tables.appendChild(descTableEl());
  const tbl = document.createElement('table'); tbl.className='desc-table';
  tbl.insertAdjacentHTML('beforeend', `<tr><th>Group</th><th>X</th><th>M</th><th>X &minus; M</th><th>(X &minus; M)&sup2;</th></tr>`);
  rows.forEach(r=>{
    const tr = document.createElement('tr');
    const gTd = document.createElement('td'); gTd.className='muted'; gTd.textContent = DATA_INDEP[r.group].label;
    tr.appendChild(gTd);
    tr.appendChild(r.xTd); tr.appendChild(r.mTd); tr.appendChild(r.devTd); tr.appendChild(r.sqTd);
    tbl.appendChild(tr);
  });

  const calcBtn = el(`<button class="primary" style="display:none;">Calculate SS</button>`);
  btnrow.appendChild(calcBtn);
  wrap.appendChild(btnrow);
  card.appendChild(wrap);

  function checkReady(){
    if(mDone.size===2) calcBtn.style.display='inline-block';
  }
  calcBtn.addEventListener('click', ()=>{
    calcBtn.style.display='none';
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const stepGap = reduced ? 0 : 220;
    const hold = reduced ? 0 : 1000;
    const phaseGap = reduced ? 0 : 400;
    const phase2Start = (rows.length-1)*stepGap + hold + phaseGap;
    const ssByGroup = {A:0, B:0};
    rows.forEach((r,i)=>{
      const x = Number(r.xTd.dataset.value);
      const M = state.desc[`M_${r.group}`];
      const dev = x - M;
      const sq = dev*dev;

        r.devTd.textContent = `${fmt(x)} − ${fmt(M)}`;

        r.devTd.textContent = fmt(dev);
        r.devTd.className = '';
      }, t0+hold);
      const t1 = phase2Start + i*stepGap;
      setTimeout(()=>{
        r.sqTd.textContent = `${fmt(dev)}²`;
        r.sqTd.className = 'compute-flash';
      }, t1);
      setTimeout(()=>{
        r.sqTd.textContent = fmt(sq);
        r.sqTd.className = '';
      }, t1+hold);
    });
    const totalTime = phase2Start + (rows.length-1)*stepGap + hold + (reduced?0:250);
    setTimeout(()=>{
      state.desc.SS_A = ssByGroup.A;
      state.desc.SS_B = ssByGroup.B;
      const result = el(`<div class="result">SS(${DATA_INDEP.A.label}) = ${fmt(ssByGroup.A)} &nbsp;&nbsp; SS(${DATA_INDEP.B.label}) = ${fmt(ssByGroup.B)}</div>`);

      const cont = el(`<button class="primary">Continue</button>`);
      cont.addEventListener('click', ()=> goto('variance'));
      btnrow.innerHTML=''; btnrow.appendChild(cont);
    }, totalTime);
  });
};

    formula.appendChild(varSlot);
    formula.appendChild(el(`<span> = </span>`));

/* ---- compute D = After − Before: drop each whole column onto the block to fill every row at once ---- */
RENDER.pt_diff = (card)=>{
  card.appendChild(el(`<h2>Step 2 &mdash; Compute the Difference Scores</h2>`));
  const wrap = document.createElement('div');
  wrap.appendChild(stepGuide(`<p class="center muted">Drag the Before column and the After column into the table &mdash; drop anywhere to fill every row with each student's own score.</p>`));
  const tables = el(`<div class="tablewrap"></div>`);
  tables.appendChild(ptSpreadsheetEl());
  wrap.appendChild(formulaRef(`D = After &minus; Before`));

  const rows = DATA_PT.before.map((b,i)=>{
    const beforeTd = document.createElement('td'); beforeTd.className='slot'; beforeTd.textContent='—';
    const afterTd = document.createElement('td'); afterTd.className='slot'; afterTd.textContent='—';
    const dTd = document.createElement('td'); dTd.className='muted'; dTd.textContent='—';
    return {before:b, after:DATA_PT.after[i], beforeTd, afterTd, dTd};
  });

  const fb = el(`<div class="feedback"></div>`);
  let beforeDone=false, afterDone=false;
  rows.forEach(r=>{
    wireDrop(r.beforeTd, (id,node)=>{
      if(id !== 'col_before'){
        shake(node); mark(false);
        fb.className='feedback bad';
        fb.textContent = id==='col_after' ? "That's the After column — drop it in the After cells instead." : "Drag the Before column here.";
        return;
      }
      if(beforeDone) return;
      beforeDone = true; markUsed(id); mark(true); fb.textContent='';
      rows.forEach(rr=>{ rr.beforeTd.textContent = rr.before; rr.beforeTd.dataset.value = rr.before; rr.beforeTd.className='slot filled'; });
      checkReady();
    });
    wireDrop(r.afterTd, (id,node)=>{
      if(id !== 'col_after'){
        shake(node); mark(false);
        fb.className='feedback bad';
        fb.textContent = id==='col_before' ? "That's the Before column — drop it in the Before cells instead." : "Drag the After column here.";
        return;
      }
      if(afterDone) return;
      afterDone = true; markUsed(id); mark(true); fb.textContent='';
      rows.forEach(rr=>{ rr.afterTd.textContent = rr.after; rr.afterTd.dataset.value = rr.after; rr.afterTd.className='slot filled'; });
      checkReady();
    });
  });

  const tbl = document.createElement('table'); tbl.className='desc-table';
  tbl.insertAdjacentHTML('beforeend', `<tr><th>P</th><th>Before</th><th>After</th><th>D</th></tr>`);
  rows.forEach((r,i)=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `<td class="muted">P${i+1}</td>`;
    tr.appendChild(r.beforeTd); tr.appendChild(r.afterTd); tr.appendChild(r.dTd);
    tbl.appendChild(tr);
  });
  tables.appendChild(tbl);
  wrap.appendChild(tables);
  wrap.appendChild(fb);

  const btnrow = el(`<div class="btnrow"></div>`);
  const calcBtn = el(`<button class="primary" style="display:none;">Calculate D</button>`);
  btnrow.appendChild(calcBtn);
  wrap.appendChild(btnrow);
  card.appendChild(wrap);

  function checkReady(){ if(beforeDone && afterDone) calcBtn.style.display='inline-block'; }
  calcBtn.addEventListener('click', ()=>{
    calcBtn.style.display='none';
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const stepGap = reduced ? 0 : 220;
    const hold = reduced ? 0 : 1000;
    rows.forEach((r,i)=>{
      const before = Number(r.beforeTd.dataset.value);
      const after = Number(r.afterTd.dataset.value);
      const d = after - before;
      const t0 = i*stepGap;
      setTimeout(()=>{
        r.dTd.textContent = `${fmt(after)} − ${fmt(before)}`;
        r.dTd.className = 'compute-flash';
      }, t0);
      setTimeout(()=>{
        r.dTd.textContent = fmt(d);
        r.dTd.className = '';
        r.D = d;
      }, t0+hold);
    });
    const totalTime = (rows.length-1)*stepGap + hold + (reduced?0:250);
    setTimeout(()=>{
      state.ptDiffs = rows.map(r=>r.D);
      const cont = el(`<button class="primary">Continue</button>`);
      cont.addEventListener('click', ()=> goto('pt_mean'));
      btnrow.innerHTML=''; btnrow.appendChild(cont);
    }, totalTime);
  });
};

/* ---- mean difference: drag the D column into ΣD/n, type n ---- */
RENDER.pt_mean = (card)=>{

  layout.appendChild(formulasCol);
  wrap.appendChild(layout);

  const formula = el(`<div class="formula">M<span class="sub">D</span> = ( </div>`);
  const colSlot = slotEl('mcol_D', '?', (id,node)=>{
    if(node.classList.contains('filled')) return;
    if(id !== 'col_D'){ shake(node); mark(false); return; }
    node.textContent = state.ptDiffs.map(fmt).join(' + ');
    node.classList.add('filled');
    markUsed(id); mark(true); checkReady();
  });
  formula.appendChild(colSlot);
  formula.appendChild(el(`<span> ) / </span>`));
  const nInput = numInput('n_input_D', state.ptDiffs.length, checkReady);

/* ---- sum of squares: drop the D column / mean onto any row to fill the whole block ---- */
RENDER.pt_ss = (card)=>{
  card.appendChild(el(`<h2>Step 2 &mdash; Sum of Squares</h2>`));
  const wrap = document.createElement('div');
  wrap.appendChild(stepGuide(`<p class="center muted">The D scores are already filled in below — drag the mean onto the M rows to fill every row.</p>`));
  wrap.appendChild(formulaRef(`SS = &Sigma;(D &minus; M<span class="sub">D</span>)&sup2;`));

  const rows = state.ptDiffs.map(d=>{
    const dTd = document.createElement('td'); dTd.textContent = d; dTd.dataset.value = d;
    const mTd = document.createElement('td'); mTd.className='slot'; mTd.textContent='—';
    const devTd = document.createElement('td'); devTd.className='muted'; devTd.textContent='—';
    const sqTd = document.createElement('td'); sqTd.className='muted'; sqTd.textContent='—';
    return {score:d, dTd, mTd, devTd, sqTd};
  });

  let mDone=false;
  rows.forEach(r=>{
    wireDrop(r.mTd, (id,node)=>{
      if(id !== 'M_D'){ shake(node); mark(false); return; }
      if(mDone) return;
      mDone = true; markUsed(id); mark(true);
      rows.forEach(rr=>{ rr.mTd.textContent = fmt(state.desc.M_D); rr.mTd.className='slot filled'; });
      checkReady();
    });
  });

  const tables = el(`<div class="tablewrap"></div>`);
  tables.appendChild(ptDescTableEl());
  const tbl = document.createElement('table'); tbl.className='desc-table';
  tbl.insertAdjacentHTML('beforeend', `<tr><th>D</th><th>M<span class="sub">D</span></th><th>D &minus; M<span class="sub">D</span></th><th>(D &minus; M<span class="sub">D</span>)&sup2;</th></tr>`);
  rows.forEach(r=>{
    const tr = document.createElement('tr');
    tr.appendChild(r.dTd); tr.appendChild(r.mTd); tr.appendChild(r.devTd); tr.appendChild(r.sqTd);
    tbl.appendChild(tr);
  });
  tables.appendChild(tbl);
  wrap.appendChild(tables);

  const btnrow = el(`<div class="btnrow"></div>`);
  const calcBtn = el(`<button class="primary" style="display:none;">Calculate SS</button>`);
  btnrow.appendChild(calcBtn);
  wrap.appendChild(btnrow);
  card.appendChild(wrap);

  function checkReady(){ if(mDone) calcBtn.style.display='inline-block'; }
  calcBtn.addEventListener('click', ()=>{
    calcBtn.style.display='none';
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const stepGap = reduced?0:220, hold = reduced?0:1000;
    const phaseGap = reduced ? 0 : 400;
    const phase2Start = (rows.length-1)*stepGap + hold + phaseGap;
    let ss = 0;
    rows.forEach((r,i)=>{
      const x = Number(r.dTd.dataset.value);
      const M = state.desc.M_D;
      const dev = x-M, sq=dev*dev;
      ss += sq;
      const t0=i*stepGap;
      setTimeout(()=>{ r.devTd.textContent = `${fmt(x)} − ${fmt(M)}`; r.devTd.className='compute-flash'; }, t0);
      setTimeout(()=>{ r.devTd.textContent=fmt(dev); r.devTd.className=''; }, t0+hold);
      const t1 = phase2Start + i*stepGap;
      setTimeout(()=>{ r.sqTd.textContent=`${fmt(dev)}²`; r.sqTd.className='compute-flash'; }, t1);
      setTimeout(()=>{ r.sqTd.textContent=fmt(sq); r.sqTd.className=''; }, t1+hold);
    });
    const totalTime = phase2Start + (rows.length-1)*stepGap + hold + (reduced?0:250);
    setTimeout(()=>{
      state.desc.SS_D = ss;
      const result = el(`<div class="result">SS = ${fmt(ss)}</div>`);
      wrap.insertBefore(result, btnrow);
      const cont = el(`<button class="primary">Continue</button>`);
      cont.addEventListener('click', ()=> goto('pt_variance'));
      btnrow.innerHTML=''; btnrow.appendChild(cont);
    }, totalTime);
  });
};

/* ---- standard error ---- */
RENDER.pt_se = (card)=>{
  card.appendChild(el(`<h2>Standard Error of the Difference Scores</h2>`));
  const wrap = el(`<div></div>`);
  wrap.appendChild(stepGuide(`<p class="center muted">Drag s and n from your descriptives table.</p>`));
  wrap.appendChild(formulaRef(`SE = s / &radic;n`));
  const formula = el(`<div class="formula">SE = <span id="a"></span> / &radic;<span id="b"></span> = <span id="res"></span></div>`);
  wrap.appendChild(formula);
  wrap.appendChild(ptDescTableEl());
  const btnrow = el(`<div class="btnrow"></div>`);
  wrap.appendChild(btnrow);
  card.appendChild(wrap);

  const filled = {};
  const map = { a:{exp:'SD_D', disp:fmt(state.desc.SD_D)}, b:{exp:'n_D', disp:state.desc.n_D} };
  ['a','b'].forEach(key=>{
    const s = slotEl('pt_se_'+key,'?', (id,node)=>handle(key,id,node));
    formula.querySelector('#'+key).replaceWith(s);
  });
  function handle(key,id,node){
    if(node.classList.contains('filled')) return;
    const conf = map[key];
    if(id===conf.exp){
      node.textContent = conf.disp;
      node.classList.add('filled');
      markUsed(id);
      filled[key]=true; mark(true);
      if(Object.keys(filled).length===2){
        const se = state.desc.SD_D/Math.sqrt(state.desc.n_D);
        state.se = se;
        formula.querySelector('#res').textContent = fmt(se);

/* ---- sum of squares: drop the column / mean onto any row to fill the whole block (t-path only) ---- */
RENDER.os_ss = (card)=>{
  const sc = state.scenario;
  card.appendChild(el(`<h2>Step 2 &mdash; Sum of Squares</h2>`));
  const wrap = document.createElement('div');
  wrap.appendChild(stepGuide(`<p class="center muted">The scores are already filled in below — drag the mean onto the M rows to fill every row.</p>`));
  wrap.appendChild(formulaRef(`SS = &Sigma;(X &minus; M)&sup2;`));

  const rows = sc.data.scores.map(s=>{
    const xTd = document.createElement('td'); xTd.textContent = s; xTd.dataset.value = s;
    const mTd = document.createElement('td'); mTd.className='slot'; mTd.textContent='—';
    const devTd = document.createElement('td'); devTd.className='muted'; devTd.textContent='—';
    const sqTd = document.createElement('td'); sqTd.className='muted'; sqTd.textContent='—';
    return {score:s, xTd, mTd, devTd, sqTd};
  });

  let mDone=false;
  rows.forEach(r=>{
    wireDrop(r.mTd, (id,node)=>{
      if(id !== 'M_OS'){ shake(node); mark(false); return; }
      if(mDone) return;
      mDone = true; markUsed(id); mark(true);
      rows.forEach(rr=>{ rr.mTd.textContent = fmt(state.desc.M_OS); rr.mTd.className='slot filled'; });
      checkReady();
    });
  });

  const tables = el(`<div class="tablewrap"></div>`);
  tables.appendChild(osDescTableEl());
  const tbl = document.createElement('table'); tbl.className='desc-table';
  tbl.insertAdjacentHTML('beforeend', `<tr><th>X</th><th>M</th><th>X &minus; M</th><th>(X &minus; M)&sup2;</th></tr>`);
  rows.forEach(r=>{
    const tr = document.createElement('tr');
    tr.appendChild(r.xTd); tr.appendChild(r.mTd); tr.appendChild(r.devTd); tr.appendChild(r.sqTd);
    tbl.appendChild(tr);
  });
  tables.appendChild(tbl);
  wrap.appendChild(tables);

  const btnrow = el(`<div class="btnrow"></div>`);
  const calcBtn = el(`<button class="primary" style="display:none;">Calculate SS</button>`);
  btnrow.appendChild(calcBtn);
  wrap.appendChild(btnrow);
  card.appendChild(wrap);

  function checkReady(){ if(mDone) calcBtn.style.display='inline-block'; }
  calcBtn.addEventListener('click', ()=>{
    calcBtn.style.display='none';
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const stepGap = reduced ? 0 : 220;
    const hold = reduced ? 0 : 1000;
    const phaseGap = reduced ? 0 : 400;
    const phase2Start = (rows.length-1)*stepGap + hold + phaseGap;
    let ss = 0;
    rows.forEach((r,i)=>{
      const x = Number(r.xTd.dataset.value);
      const M = state.desc.M_OS;
      const dev = x-M, sq = dev*dev;
      ss += sq;
      const t0 = i*stepGap;
      setTimeout(()=>{ r.devTd.textContent = `${fmt(x)} − ${fmt(M)}`; r.devTd.className = 'compute-flash'; }, t0);
      setTimeout(()=>{ r.devTd.textContent = fmt(dev); r.devTd.className=''; }, t0+hold);
      const t1 = phase2Start + i*stepGap;
      setTimeout(()=>{ r.sqTd.textContent = `${fmt(dev)}²`; r.sqTd.className='compute-flash'; }, t1);
      setTimeout(()=>{ r.sqTd.textContent = fmt(sq); r.sqTd.className=''; }, t1+hold);
    });
    const totalTime = phase2Start + (rows.length-1)*stepGap + hold + (reduced?0:250);
    setTimeout(()=>{
      state.desc.SS_OS = ss;
      const result = el(`<div class="result">SS = ${fmt(ss)}</div>`);
      wrap.insertBefore(result, btnrow);
      const cont = el(`<button class="primary">Continue</button>`);
      cont.addEventListener('click', ()=> goto('os_variance'));
      btnrow.innerHTML=''; btnrow.appendChild(cont);
    }, totalTime);
  });
};

      const se = sc.data.popSD/Math.sqrt(state.desc.n_OS);
      state.se = se;
      formula.querySelector('#res').textContent = fmt(se);
      const cont = el(`<button class="primary">Continue</button>`);
      cont.addEventListener('click', ()=> goto('os_zcalc'));
      btnrow.appendChild(cont);
    }
  }
  const aInput = numInput('os_zse_a', sc.data.popSD, ()=>{ filled.a=true; checkDone(); });
  formula.querySelector('#a').replaceWith(aInput);
  const bSlot = slotEl('os_zse_b','?', (id,node)=>{
    if(node.classList.contains('filled')) return;
    if(id !== 'n_OS'){ shake(node); mark(false); return; }
    node.textContent = state.desc.n_OS;
    node.classList.add('filled');
    markUsed(id); mark(true);
    filled.b=true; checkDone();
  });
  formula.querySelector('#b').replaceWith(bSlot);
};

RENDER.os_zcalc = (card)=>{
  const sc = state.scenario;
  card.appendChild(el(`<h2>Calculate z</h2>`));
  const wrap = el(`<div></div>`);
  wrap.appendChild(stepGuide(`<p class="center muted">Drag M from your descriptives table, and SE from below.</p>`));
  wrap.appendChild(formulaRef(`z = ( M &minus; &mu; ) / &sigma;<span class="sub">M</span>`));
  const formula = el(`<div class="formula">z = ( <span id="a"></span> &minus; ${sc.data.popValue} ) / <span id="b"></span> = <span id="res"></span></div>`);
  wrap.appendChild(formula);
  wrap.appendChild(osDescTableEl());
  const pool = el(`<div class="chippool"></div>`);
  pool.appendChild(chipEl('SEv_osz','&sigma;M = '+fmt(state.se)));
  wrap.appendChild(pool);
  const btnrow = el(`<div class="btnrow"></div>`);
  wrap.appendChild(btnrow);
  card.appendChild(wrap);

  const filled = {};
  const map = { a:{exp:'M_OS', disp:fmt(state.desc.M_OS)}, b:{exp:'SEv_osz', disp:fmt(state.se)} };
  ['a','b'].forEach(key=>{
    const s = slotEl('os_z_'+key,'?', (id,node)=>handle(key,id,node));
    formula.querySelector('#'+key).replaceWith(s);
  });
  function handle(key,id,node){
    if(node.classList.contains('filled')) return;
    const conf = map[key];
    if(id===conf.exp){
      node.textContent = conf.disp;
      node.classList.add('filled');
      markUsed(id);
      filled[key]=true; mark(true);
      if(Object.keys(filled).length===2){
        const z = (state.desc.M_OS - sc.data.popValue)/state.se;
        state.tobt = z;
        formula.querySelector('#res').textContent = fmt(z);
        const cont = el(`<button class="primary">Continue: Make a Decision</button>`);
        cont.addEventListener('click', ()=> goto('compare'));
        btnrow.appendChild(cont);
      }
    } else { shake(node); mark(false); }
  }
};

/* ---- within-groups SS: drop each group's column / mean onto its rows to fill the whole block ---- */
RENDER.ao_ss = (card)=>{
  card.appendChild(el(`<h2>Step 2 &mdash; Sum of Squares (Within Groups)</h2>`));
  const wrap = document.createElement('div');
  wrap.appendChild(stepGuide(`<p class="center muted">The scores are already filled in below — drag each group's mean onto its M rows to fill that group's rows.</p>`));
  wrap.appendChild(formulaRef(`SS = &Sigma;(X &minus; M)&sup2;`));

  const groups = aoGroupKeys();
  const rows = [];
  groups.forEach(group=>{
    DATA_ANOVA.groups[group].scores.forEach(score=>{
      const xTd = document.createElement('td'); xTd.textContent = score; xTd.dataset.value = score;
      const mTd = document.createElement('td'); mTd.className='slot'; mTd.textContent='—';
      const devTd = document.createElement('td'); devTd.className='muted'; devTd.textContent='—';
      const sqTd = document.createElement('td'); sqTd.className='muted'; sqTd.textContent='—';
      rows.push({group, score, xTd, mTd, devTd, sqTd});
    });
  });

  const fb = el(`<div class="feedback"></div>`);
  const mDone = new Set();
  rows.forEach(r=>{
    wireDrop(r.mTd, (id,node)=>{
      const m = id.match(/^M_([A-Z])$/);
      if(!m){ shake(node); mark(false); return; }
      const grp = m[1];
      if(mDone.has(grp)) return;
      if(grp !== r.group){
        shake(node); mark(false);
        fb.className='feedback bad';
        fb.textContent = `That's ${poss(DATA_ANOVA.groups[grp].label)} mean — drop it on the ${DATA_ANOVA.groups[grp].label} rows instead.`;
        return;
      }
      mDone.add(grp); markUsed(id); mark(true); fb.textContent='';
      rows.filter(rr=>rr.group===grp).forEach(rr=>{ rr.mTd.textContent=fmt(state.desc[`M_${grp}`]); rr.mTd.className='slot filled'; });
      checkReady();
    });
  });

  const tables = el(`<div class="tablewrap"></div>`);
  tables.appendChild(aoDescTableEl());
  const tbl = document.createElement('table'); tbl.className='desc-table';
  tbl.insertAdjacentHTML('beforeend', `<tr><th>Group</th><th>X</th><th>M</th><th>X &minus; M</th><th>(X &minus; M)&sup2;</th></tr>`);
  rows.forEach(r=>{
    const tr = document.createElement('tr');
    const gTd = document.createElement('td'); gTd.className='muted'; gTd.textContent = DATA_ANOVA.groups[r.group].label;
    tr.appendChild(gTd);
    tr.appendChild(r.xTd); tr.appendChild(r.mTd); tr.appendChild(r.devTd); tr.appendChild(r.sqTd);
    tbl.appendChild(tr);
  });
  tables.appendChild(tbl);
  wrap.appendChild(tables);
  wrap.appendChild(fb);

  const btnrow = el(`<div class="btnrow"></div>`);
  const calcBtn = el(`<button class="primary" style="display:none;">Calculate SS</button>`);
  btnrow.appendChild(calcBtn);
  wrap.appendChild(btnrow);
  card.appendChild(wrap);

  function checkReady(){ if(mDone.size===groups.length) calcBtn.style.display='inline-block'; }
  calcBtn.addEventListener('click', ()=>{
    calcBtn.style.display='none';
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const stepGap = reduced ? 0 : 160;
    const hold = reduced ? 0 : 800;
    const phaseGap = reduced ? 0 : 400;
    const phase2Start = (rows.length-1)*stepGap + hold + phaseGap;
    const ssByGroup = {};
    groups.forEach(g=> ssByGroup[g]=0);
    rows.forEach((r,i)=>{
      const x = Number(r.xTd.dataset.value);
      const M = state.desc[`M_${r.group}`];
      const dev = x-M, sq = dev*dev;
      ssByGroup[r.group] += sq;
      const t0 = i*stepGap;
      setTimeout(()=>{ r.devTd.textContent = `${fmt(x)} − ${fmt(M)}`; r.devTd.className='compute-flash'; }, t0);
      setTimeout(()=>{ r.devTd.textContent = fmt(dev); r.devTd.className=''; }, t0+hold);
      const t1 = phase2Start + i*stepGap;
      setTimeout(()=>{ r.sqTd.textContent = `${fmt(dev)}²`; r.sqTd.className='compute-flash'; }, t1);
      setTimeout(()=>{ r.sqTd.textContent = fmt(sq); r.sqTd.className=''; }, t1+hold);
    });
    const totalTime = phase2Start + (rows.length-1)*stepGap + hold + (reduced?0:250);
    setTimeout(()=>{
      groups.forEach(g=> state.desc[`SS_${g}`] = ssByGroup[g]);
      const result = el(`<div class="result">${groups.map(g=>`SS(${DATA_ANOVA.groups[g].label}) = ${fmt(ssByGroup[g])}`).join(' &nbsp; ')}</div>`);
      wrap.insertBefore(result, btnrow);
      const cont = el(`<button class="primary">Continue</button>`);
      cont.addEventListener('click', ()=> goto('ao_desc_summary'));
      btnrow.innerHTML=''; btnrow.appendChild(cont);
    }, totalTime);
  });
};

RENDER.ao_anova_table = (card)=>{

  wrap.appendChild(stepGuide(`<p class="center muted">Type each df, then drag values to compute MS and F. Completed values become draggable for the next formula.</p>`));

  const SSB = state.desc.SS_between, SSW = state.desc.SS_within;

  const tbl = document.createElement('table'); tbl.className='desc-table';

  wrap.appendChild(formulaRef(`MS = SS / df`));
  const msbFilled = {};
  const msbFormula = el(`<div class="formula">MS<span class="sub">between</span> = <span id="msb_a"></span> / <span id="msb_b"></span> = <span id="msb_res"></span></div>`);

  const msbB = slotEl('msb_b_slot','?', (id,node)=>{
    if(node.classList.contains('filled')) return;

    node.textContent=fmt(state.df1); node.classList.add('filled'); markUsed(id); mark(true);
    msbFilled.b=true; tryMSB();
  });
  msbFormula.querySelector('#msb_a').replaceWith(msbA);
  msbFormula.querySelector('#msb_b').replaceWith(msbB);
  wrap.appendChild(msbFormula);

  const mswFilled = {};
  const mswFormula = el(`<div class="formula">MS<span class="sub">within</span> = <span id="msw_a"></span> / <span id="msw_b"></span> = <span id="msw_res"></span></div>`);
  const mswA = slotEl('msw_a_slot','?', (id,node)=>{
    if(node.classList.contains('filled')) return;
    if(id!=='SSW'){ shake(node); mark(false); return; }
    node.textContent=fmt(SSW); node.classList.add('filled'); markUsed(id); mark(true);
    mswFilled.a=true; tryMSW();
  });
  const mswB = slotEl('msw_b_slot','?', (id,node)=>{
    if(node.classList.contains('filled')) return;
    if(id!=='dfW'){ shake(node); mark(false); return; }
    node.textContent=fmt(state.df2); node.classList.add('filled'); markUsed(id); mark(true);
    mswFilled.b=true; tryMSW();
  });
  mswFormula.querySelector('#msw_a').replaceWith(mswA);
  mswFormula.querySelector('#msw_b').replaceWith(mswB);
  wrap.appendChild(mswFormula);

  wrap.appendChild(formulaRef(`F = MS<span class="sub">between</span> / MS<span class="sub">within</span>`));
  const fFilled = {};
  const fFormula = el(`<div class="formula">F = <span id="f_a"></span> / <span id="f_b"></span> = <span id="f_res"></span></div>`);
  const fA = slotEl('f_a_slot','?', (id,node)=>{

    fFilled.a=true; tryF();
  });
  const fB = slotEl('f_b_slot','?', (id,node)=>{
    if(node.classList.contains('filled')) return;
    if(id!=='MSW'){ shake(node); mark(false); return; }

  });
  fFormula.querySelector('#f_a').replaceWith(fA);
  fFormula.querySelector('#f_b').replaceWith(fB);
  wrap.appendChild(fFormula);

  const btnrow = el(`<div class="btnrow"></div>`);

  function tryMSB(){
    if(msbFilled.a && msbFilled.b){

/* ---- F critical value lookup ---- */
RENDER.ao_critical = (card)=>{
  card.appendChild(el(`
    <div>
      <h2>Find the Critical Value</h2>
      <p class="center muted">&alpha; = .05, df = (${state.df1}, ${state.df2}). F-tests only have a right-hand tail — click the correct cell.</p>
    </div>`));
  const wrap = el(`<div></div>`);
  const rows = [ {df2:10, val:3.98}, {df2:12, val:3.89}, {df2:15, val:3.68} ];
  wrap.appendChild(distributionChart('F', (rows.find(r=>r.df2===state.df2) || rows[1]).val));
  const tbl = el(`<table class="desc-table"><tr><th>df&#8322; (within)</th><th>F-critical (df&#8321;=2, &alpha;=.05)</th></tr></table>`);
  const fb = el(`<div class="feedback"></div>`);
  const btnrow = el(`<div class="btnrow"></div>`);
  rows.forEach(r=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${r.df2}</td>`;
    const td = document.createElement('td');
    const cell = el(`<span class="slot" style="min-width:70px;">${r.val.toFixed(2)}</span>`);
    cell.addEventListener('click', ()=>{
      if(r.df2 === state.df2){
        mark(true);
        state.tcrit = r.val;
        cell.classList.add('filled');
        fb.className='feedback good';
        fb.textContent = `Correct — F-critical = ${r.val}`;
        const cont = el(`<button class="primary">Continue</button>`);
        cont.addEventListener('click', ()=> goto('ao_compare'));
        btnrow.innerHTML=''; btnrow.appendChild(cont);
      } else {
        mark(false);
        cell.classList.add('wrong'); setTimeout(()=>cell.classList.remove('wrong'),300);
        fb.className='feedback bad';
        fb.textContent = `That row is for df&#8322; = ${r.df2}. Our df&#8322; (within) is ${state.df2} — look for that row.`;
      }
    });
    td.appendChild(cell);
    tr.appendChild(td);
    tbl.appendChild(tr);
  });
  wrap.appendChild(tbl);
  wrap.appendChild(fb);
  wrap.appendChild(btnrow);
  card.appendChild(wrap);
};

/* ---- compare & decide (F is one-tailed, always non-negative) ---- */
RENDER.ao_compare = (card)=>{
  const F = state.tobt, Fc = state.tcrit;
  const maxVal = Math.max(F, Fc) * 1.25;
  const scale = 340/maxVal;
  const xF = 40 + F*scale;
  const xFc = 40 + Fc*scale;
  card.appendChild(el(`
    <div>
      <h2>Step 5 &mdash; Compare &amp; Decide</h2>
      <svg viewBox="0 0 420 90" width="100%" height="90">
        <line x1="40" y1="45" x2="400" y2="45" stroke="var(--border)" stroke-width="2"/>
        <line x1="${xFc}" y1="25" x2="${xFc}" y2="65" stroke="var(--bad)" stroke-width="2"/>
        <text x="${xFc}" y="20" font-size="11" fill="var(--bad)" text-anchor="middle">F crit</text>
        <circle cx="${xF}" cy="45" r="6" fill="var(--accent)"/>
        <text x="${xF}" y="75" font-size="11" fill="var(--accent)" text-anchor="middle">F obt</text>
      </svg>
      <p class="center">F<span class="sub">obt</span> = ${fmt(F)} &nbsp;&nbsp; F<span class="sub">crit</span> = ${fmt(Fc)}</p>
      <p class="center muted">Unlike t or z, F is never negative and the rejection region is only on the right. If F obt exceeds F critical, the result falls in the rejection region.</p>
    </div>`));
  const wrap = el(`<div></div>`);
  const row = el(`<div class="btnrow"></div>`);
  const fb = el(`<div class="feedback"></div>`);
  const b1 = el(`<button>Reject H₀</button>`);
  const b2 = el(`<button>Fail to Reject H₀</button>`);
  const shouldReject = F > Fc;
  function choose(val){
    const correct = (val==='reject') === shouldReject;
    state.decisionMade = val;
    if(correct){
      mark(true);
      fb.className='feedback good';
      fb.textContent = shouldReject
        ? `Right — ${fmt(F)} exceeds ${fmt(Fc)}, so the result falls in the rejection region.`
        : `Right — ${fmt(F)} does not exceed ${fmt(Fc)}, so we don't have enough evidence of a difference.`;
      const cont = el(`<button class="primary">Continue</button>`);
      cont.addEventListener('click', ()=> goto('conclusion'));
      row.innerHTML=''; row.appendChild(cont);
    } else {
      mark(false);
      fb.className='feedback bad';
      fb.textContent = `Check the number line again — is the blue dot past the red line?`;
    }
  }
  b1.addEventListener('click', ()=> choose('reject'));
  b2.addEventListener('click', ()=> choose('fail'));
  row.appendChild(b1); row.appendChild(b2);
  wrap.appendChild(row); wrap.appendChild(fb);
  card.appendChild(wrap);
};

  wrap.appendChild(formulaRef(`SS<span class="sub">total</span> = &Sigma;(X &minus; M<span class="sub">grand</span>)&sup2;`));

  const keys = rmConditionKeys();
  const grand = state.desc.M_grand;
  const rows = [];
  keys.forEach(k=>{
    DATA_RM.conditions[k].scores.forEach(score=>{
      const xTd = document.createElement('td'); xTd.className='slot'; xTd.textContent='—';

      rows.push({cond:k, score, xTd, devTd, sqTd});
    });
  });

  const fb = el(`<div class="feedback"></div>`);
  const xDone = new Set();
  rows.forEach(r=>{
    wireDrop(r.xTd, (id,node)=>{
      const m = id.match(/^col_(\w+)$/);
      if(!m || !keys.includes(m[1])){ shake(node); mark(false); return; }

        shake(node); mark(false);
        fb.className='feedback bad';
        fb.textContent = `That's ${poss(DATA_RM.conditions[k].label)} scores — drop them on the ${DATA_RM.conditions[k].label} rows instead.`;
        return;
      }
      xDone.add(k); markUsed(id); mark(true); fb.textContent='';
      rows.filter(rr=>rr.cond===k).forEach(rr=>{ rr.xTd.textContent=rr.score; rr.xTd.dataset.value=rr.score; rr.xTd.className='slot filled'; });
      checkReady();
    });
  });

  const tbl = document.createElement('table'); tbl.className='desc-table';
  tbl.insertAdjacentHTML('beforeend', `<tr><th>Condition</th><th>X</th><th>X &minus; M<span class="sub">grand</span></th><th>(...)&sup2;</th></tr>`);
  rows.forEach(r=>{
    const tr = document.createElement('tr');
    const cTd = document.createElement('td'); cTd.className='muted'; cTd.textContent = DATA_RM.conditions[r.cond].label;
    tr.appendChild(cTd);
    tr.appendChild(r.xTd); tr.appendChild(r.devTd); tr.appendChild(r.sqTd);
    tbl.appendChild(tr);
  });
  tables.appendChild(tbl);
  wrap.appendChild(tables);
  wrap.appendChild(fb);

  const btnrow = el(`<div class="btnrow"></div>`);
  const calcBtn = el(`<button class="primary" style="display:none;">Calculate SS<span class="sub">total</span></button>`);
  btnrow.appendChild(calcBtn);
  wrap.appendChild(btnrow);
  card.appendChild(wrap);

  function checkReady(){ if(xDone.size===keys.length) calcBtn.style.display='inline-block'; }
  calcBtn.addEventListener('click', ()=>{
    calcBtn.style.display='none';
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const stepGap = reduced ? 0 : 160;
    const hold = reduced ? 0 : 800;
    const phaseGap = reduced ? 0 : 400;
    const phase2Start = (rows.length-1)*stepGap + hold + phaseGap;
    let ssTotal = 0;
    rows.forEach((r,i)=>{
      const x = Number(r.xTd.dataset.value);
      const dev = x-grand, sq = dev*dev;
      ssTotal += sq;
      const t0 = i*stepGap;
      setTimeout(()=>{ r.devTd.textContent = `${fmt(x)} − ${fmt(grand)}`; r.devTd.className='compute-flash'; }, t0);
      setTimeout(()=>{ r.devTd.textContent = fmt(dev); r.devTd.className=''; }, t0+hold);
      const t1 = phase2Start + i*stepGap;
      setTimeout(()=>{ r.sqTd.textContent = `${fmt(dev)}²`; r.sqTd.className='compute-flash'; }, t1);
      setTimeout(()=>{ r.sqTd.textContent = fmt(sq); r.sqTd.className=''; }, t1+hold);
    });
    const totalTime = phase2Start + (rows.length-1)*stepGap + hold + (reduced?0:250);
    setTimeout(()=>{
      state.desc.SS_total = ssTotal;
      const result = el(`<div class="result">SS<span class="sub">total</span> = ${fmt(ssTotal)}</div>`);
      wrap.insertBefore(result, btnrow);
      const cont = el(`<button class="primary">Continue</button>`);
      cont.addEventListener('click', ()=> goto('rm_ss_treatments'));
      btnrow.innerHTML=''; btnrow.appendChild(cont);
    }, totalTime);
  });
};

  const tbl = document.createElement('table'); tbl.className='desc-table';

/* ---- SS error: SStotal − SStreatments − SSsubjects ---- */
RENDER.rm_ss_error = (card)=>{
  card.appendChild(el(`<h2>Step 4 &mdash; Sum of Squares: Error</h2>`));
  const wrap = document.createElement('div');
  wrap.appendChild(stepGuide(`<p class="center muted">Removing subject differences from the leftover variability gives us the error term. Drag the three totals into the formula.</p>`));
  wrap.appendChild(formulaRef(`SS<span class="sub">error</span> = SS<span class="sub">total</span> &minus; SS<span class="sub">treatments</span> &minus; SS<span class="sub">subjects</span>`));

  const pool = el(`<div class="chippool"></div>`);
  pool.appendChild(chipEl('SStot_chip', 'SStotal = '+fmt(state.desc.SS_total)));
  pool.appendChild(chipEl('SStreat_chip', 'SStreatments = '+fmt(state.desc.SS_treatments)));
  pool.appendChild(chipEl('SSsubj_chip', 'SSsubjects = '+fmt(state.desc.SS_subjects)));
  wrap.appendChild(pool);

  const formula = el(`<div class="formula">SS<span class="sub">error</span> = <span id="a"></span> &minus; <span id="b"></span> &minus; <span id="c"></span> = <span id="res"></span></div>`);
  wrap.appendChild(formula);
  const btnrow = el(`<div class="btnrow"></div>`);
  wrap.appendChild(btnrow);
  card.appendChild(wrap);

  const filled = {};
  const map = { a:{exp:'SStot_chip', disp:fmt(state.desc.SS_total)}, b:{exp:'SStreat_chip', disp:fmt(state.desc.SS_treatments)}, c:{exp:'SSsubj_chip', disp:fmt(state.desc.SS_subjects)} };
  ['a','b','c'].forEach(key=>{
    const s = slotEl('sse_'+key,'?', (id,node)=>handle(key,id,node));
    formula.querySelector('#'+key).replaceWith(s);
  });
  function handle(key,id,node){
    if(node.classList.contains('filled')) return;
    const conf = map[key];
    if(id===conf.exp){
      node.textContent = conf.disp;
      node.classList.add('filled');
      markUsed(id);
      filled[key]=true; mark(true);
      if(Object.keys(filled).length===3){
        const err = state.desc.SS_total - state.desc.SS_treatments - state.desc.SS_subjects;
        state.desc.SS_error = err;
        formula.querySelector('#res').textContent = fmt(err);
        const cont = el(`<button class="primary">Continue</button>`);
        cont.addEventListener('click', ()=> goto('rm_anova_table'));
        btnrow.appendChild(cont);
      }
    } else { shake(node); mark(false); }
  }
};

/* ---- ANOVA source table: Treatments/Subjects/Error/Total ---- */
RENDER.rm_anova_table = (card)=>{
  card.appendChild(el(`<h2>Step 4 &mdash; Complete the ANOVA Table</h2>`));
  const wrap = document.createElement('div');
  wrap.appendChild(stepGuide(`<p class="center muted">Type each df, then drag values to compute MS and F. Completed values become draggable for the next formula.</p>`));

  const SST = state.desc.SS_treatments, SSS = state.desc.SS_subjects, SSE = state.desc.SS_error, SSTot = state.desc.SS_total;
  const n = state.rmN, k = state.rmK;
  const N = state.desc.N_total;

  const tbl = document.createElement('table'); tbl.className='desc-table';
  tbl.insertAdjacentHTML('beforeend', `<tr><th>Source</th><th>SS</th><th>df</th><th>MS</th><th>F</th></tr>`);
  function row(label){
    const tr = document.createElement('tr');
    const labelTd = document.createElement('td'); labelTd.className='muted'; labelTd.textContent=label;
    const cells = [0,0,0,0].map(()=>{ const td=document.createElement('td'); td.className='muted'; td.textContent='—'; return td; });
    tr.appendChild(labelTd); cells.forEach(c=>tr.appendChild(c));
    tbl.appendChild(tr);
    return {ssTd:cells[0], dfTd:cells[1], msTd:cells[2], fTd:cells[3]};
  }
  const rTreat = row('Treatments');
  const rSubj = row('Subjects');
  const rErr = row('Error');
  const rTot = row('Total');
  function setCell(td, id, value){
    td.innerHTML=''; td.className='';
    if(id) td.appendChild(chipEl(id, fmt(value)));
    else td.textContent = fmt(value);
  }
  setCell(rTreat.ssTd, 'SST_chip', SST);
  setCell(rSubj.ssTd, null, SSS);
  setCell(rErr.ssTd, 'SSE_chip', SSE);
  setCell(rTot.ssTd, null, SSTot);
  wrap.appendChild(tbl);

  wrap.appendChild(formulaRef(`df<span class="sub">treatments</span> = k &minus; 1 &nbsp;&nbsp;&nbsp; df<span class="sub">error</span> = (n &minus; 1)(k &minus; 1)`));
  const dfRow1 = el(`<div class="formula"><span>df<span class="sub">treatments</span> = ${k} &minus; 1 = </span></div>`);
  const dftInput = numInput('dft_input', k-1, ()=>{
    setCell(rTreat.dfTd, 'dfT_chip', k-1);
    state.df1 = k-1;
    setCell(rSubj.dfTd, null, n-1);
    setCell(rTot.dfTd, null, N-1);
  });
  dfRow1.appendChild(dftInput);
  wrap.appendChild(dfRow1);
  const dfRow2 = el(`<div class="formula"><span>df<span class="sub">error</span> = (${n} &minus; 1)(${k} &minus; 1) = </span></div>`);
  const dfeInput = numInput('dfe_input', (n-1)*(k-1), ()=>{
    setCell(rErr.dfTd, 'dfE_chip', (n-1)*(k-1));
    state.df2 = (n-1)*(k-1);
  });
  dfRow2.appendChild(dfeInput);
  wrap.appendChild(dfRow2);

  wrap.appendChild(formulaRef(`MS = SS / df`));
  const mstFilled = {};
  const mstFormula = el(`<div class="formula">MS<span class="sub">treatments</span> = <span id="mst_a"></span> / <span id="mst_b"></span> = <span id="mst_res"></span></div>`);
  const mstA = slotEl('mst_a_slot','?', (id,node)=>{
    if(node.classList.contains('filled')) return;
    if(id!=='SST_chip'){ shake(node); mark(false); return; }
    node.textContent=fmt(SST); node.classList.add('filled'); markUsed(id); mark(true);
    mstFilled.a=true; tryMST();
  });
  const mstB = slotEl('mst_b_slot','?', (id,node)=>{
    if(node.classList.contains('filled')) return;
    if(id!=='dfT_chip'){ shake(node); mark(false); return; }
    node.textContent=fmt(state.df1); node.classList.add('filled'); markUsed(id); mark(true);
    mstFilled.b=true; tryMST();
  });
  mstFormula.querySelector('#mst_a').replaceWith(mstA);
  mstFormula.querySelector('#mst_b').replaceWith(mstB);
  wrap.appendChild(mstFormula);

  const mseFilled = {};
  const mseFormula = el(`<div class="formula">MS<span class="sub">error</span> = <span id="mse_a"></span> / <span id="mse_b"></span> = <span id="mse_res"></span></div>`);
  const mseA = slotEl('mse_a_slot','?', (id,node)=>{
    if(node.classList.contains('filled')) return;
    if(id!=='SSE_chip'){ shake(node); mark(false); return; }
    node.textContent=fmt(SSE); node.classList.add('filled'); markUsed(id); mark(true);
    mseFilled.a=true; tryMSE();
  });
  const mseB = slotEl('mse_b_slot','?', (id,node)=>{
    if(node.classList.contains('filled')) return;
    if(id!=='dfE_chip'){ shake(node); mark(false); return; }
    node.textContent=fmt(state.df2); node.classList.add('filled'); markUsed(id); mark(true);
    mseFilled.b=true; tryMSE();
  });
  mseFormula.querySelector('#mse_a').replaceWith(mseA);
  mseFormula.querySelector('#mse_b').replaceWith(mseB);
  wrap.appendChild(mseFormula);

  wrap.appendChild(formulaRef(`F = MS<span class="sub">treatments</span> / MS<span class="sub">error</span>`));
  const fFilled = {};
  const fFormula = el(`<div class="formula">F = <span id="f_a"></span> / <span id="f_b"></span> = <span id="f_res"></span></div>`);
  const fA = slotEl('rmf_a_slot','?', (id,node)=>{
    if(node.classList.contains('filled')) return;
    if(id!=='MST_chip'){ shake(node); mark(false); return; }
    node.textContent=fmt(state.msTreatments); node.classList.add('filled'); markUsed(id); mark(true);
    fFilled.a=true; tryF();
  });
  const fB = slotEl('rmf_b_slot','?', (id,node)=>{
    if(node.classList.contains('filled')) return;
    if(id!=='MSE_chip'){ shake(node); mark(false); return; }
    node.textContent=fmt(state.msError); node.classList.add('filled'); markUsed(id); mark(true);
    fFilled.b=true; tryF();
  });
  fFormula.querySelector('#f_a').replaceWith(fA);
  fFormula.querySelector('#f_b').replaceWith(fB);
  wrap.appendChild(fFormula);

  const btnrow = el(`<div class="btnrow"></div>`);
  wrap.appendChild(btnrow);
  card.appendChild(wrap);

  function tryMST(){
    if(mstFilled.a && mstFilled.b){
      const ms = SST/state.df1;
      state.msTreatments = ms;
      mstFormula.querySelector('#mst_res').textContent = fmt(ms);
      setCell(rTreat.msTd, 'MST_chip', ms);
    }
  }
  function tryMSE(){
    if(mseFilled.a && mseFilled.b){
      const ms = SSE/state.df2;
      state.msError = ms;
      mseFormula.querySelector('#mse_res').textContent = fmt(ms);
      setCell(rErr.msTd, 'MSE_chip', ms);
    }
  }
  function tryF(){
    if(fFilled.a && fFilled.b){
      const F = state.msTreatments/state.msError;
      state.tobt = F;
      fFormula.querySelector('#f_res').textContent = fmt(F);
      setCell(rTreat.fTd, null, F);
      const cont = el(`<button class="primary">Continue</button>`);
      cont.addEventListener('click', ()=> goto('rm_critical'));
      btnrow.appendChild(cont);
    }
  }
};

/* ---- F critical value lookup ---- */
RENDER.rm_critical = (card)=>{
  card.appendChild(el(`
    <div>
      <h2>Find the Critical Value</h2>
      <p class="center muted">&alpha; = .05, df = (${state.df1}, ${state.df2}). F-tests only have a right-hand tail — click the correct cell.</p>
    </div>`));
  const wrap = el(`<div></div>`);
  const rows = [ {df2:6, val:5.14}, {df2:8, val:4.46}, {df2:10, val:4.10} ];
  wrap.appendChild(distributionChart('F', (rows.find(r=>r.df2===state.df2) || rows[1]).val));
  const tbl = el(`<table class="desc-table"><tr><th>df&#8322; (error)</th><th>F-critical (df&#8321;=2, &alpha;=.05)</th></tr></table>`);
  const fb = el(`<div class="feedback"></div>`);
  const btnrow = el(`<div class="btnrow"></div>`);
  rows.forEach(r=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${r.df2}</td>`;
    const td = document.createElement('td');
    const cell = el(`<span class="slot" style="min-width:70px;">${r.val.toFixed(2)}</span>`);
    cell.addEventListener('click', ()=>{
      if(r.df2 === state.df2){
        mark(true);
        state.tcrit = r.val;
        cell.classList.add('filled');
        fb.className='feedback good';
        fb.textContent = `Correct — F-critical = ${r.val}`;
        const cont = el(`<button class="primary">Continue</button>`);
        cont.addEventListener('click', ()=> goto('ao_compare'));
        btnrow.innerHTML=''; btnrow.appendChild(cont);
      } else {

    tr.appendChild(td);
    tbl.appendChild(tr);

};

/* ---------- hypotheses ---------- */
RENDER.hypotheses = (card)=>{
  const hyp = state.scenario.hyp;
  card.appendChild(el(`<h2>Step 4 &mdash; State the Hypotheses</h2>`));
  const wrap = el(`<div></div>`);
  wrap.appendChild(el(`<p class="center muted">Drag the correct symbols into each hypothesis.</p>`));

  const symbols = hyp.symbols;
  const expected = {};
  hyp.h0.forEach((id,i)=> expected[`h0_${i}`]=id);
  if(hyp.h1) hyp.h1.forEach((id,i)=> expected[`h1_${i}`]=id);
  const filledState = {};
  const totalBlanks = hyp.h0.length + (hyp.h1 ? hyp.h1.length : 0);

  function makeRow(prefix, labelHTML, count){
    const row = el(`<div class="formula"><span style="min-width:38px;">${labelHTML}:</span></div>`);
    for(let i=0;i<count;i++){
      const key = `${prefix}_${i}`;
      const s = slotEl(key, '?', (id, slotNode)=>{
        if(slotNode.classList.contains('filled')) return;
        if(id === expected[key]){
          const sym = symbols.find(sy=>sy.id===id);
          slotNode.innerHTML = sym.label;
          slotNode.classList.add('filled');
          filledState[key]=true;
          mark(true);
          checkDone();
        } else {
          slotNode.classList.add('wrong');
          setTimeout(()=> slotNode.classList.remove('wrong'), 300);
          mark(false);
        }
      });
      row.appendChild(s);
    }
    return row;
  }
  wrap.appendChild(makeRow('h0','H₀', hyp.h0.length));
  if(hyp.h1){
    wrap.appendChild(makeRow('h1','H₁', hyp.h1.length));
  } else if(hyp.h1Static){
    wrap.appendChild(el(`<p class="center" style="font-weight:600;">${hyp.h1Static}</p>`));
  }

  const pool = el(`<div class="chippool"></div>`);
  symbols.forEach(sy=> pool.appendChild(chipEl(sy.id, sy.label)));
  wrap.appendChild(pool);

  const fb = el(`<div class="feedback"></div>`);
  wrap.appendChild(fb);
  const btnrow = el(`<div class="btnrow"></div>`);
  wrap.appendChild(btnrow);
  card.appendChild(wrap);

  function checkDone(){
    if(Object.keys(filledState).length === totalBlanks){
      fb.className='feedback good';
      fb.innerHTML = hyp.explanation;
      const cont = el(`<button class="primary">Continue</button>`);
      cont.addEventListener('click', ()=> goto(hyp.afterHyp));
      btnrow.appendChild(cont);
    }
  }
};

/* ---------- df ---------- */
