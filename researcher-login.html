<!DOCTYPE html>
<html>
<head>
    <title>Spatial Platform Researcher Login</title>

    <!-- Supabase JS library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 50px auto;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
        }

        #message {
            margin-top: 20px;
        }
    </style>

</head>

<body>

<h1>Researcher Login</h1>

<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button onclick="signUp()">Create Account</button>
<button onclick="signIn()">Login</button>
<button onclick="signOut()">Logout</button>

<div id="message"></div>

<h2>Researcher Profile</h2>

<input id="name" placeholder="Full name">
<input id="institution" placeholder="Institution">

<button onclick="saveProfile()">
Save Profile
</button>

    
<script>

    // ----------------------------
    // SUPABASE CONNECTION
    // ----------------------------

    const SUPABASE_URL = "https://lfboldtuuwfayloofdnm.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_EfNrQHSaudaeiW-DYB5S0A_W863mPxN";


    const supabaseClient = supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


    // ----------------------------
    // CREATE ACCOUNT
    // ----------------------------

    async function signUp(){

        const email =
            document.getElementById("email").value;

        const password =
            document.getElementById("password").value;


        const {data, error} =
            await supabaseClient.auth.signUp({
                email: email,
                password: password
            });


        if(error){
            show(error.message);
        }
        else{
            show(
              "Account created. Check your email if confirmation is enabled."
            );
        }

    }


    // ----------------------------
    // LOGIN
    // ----------------------------

    async function signIn(){

        const email =
            document.getElementById("email").value;

        const password =
            document.getElementById("password").value;


        const {data, error} =
            await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });


        if(error){
            show(error.message);
        }
        else{
            show(
                "Welcome, " + data.user.email
            );

        }

    }



    // ----------------------------
    // LOGOUT
    // ----------------------------

    async function signOut(){

        await supabaseClient.auth.signOut();

        show("Logged out");

    }



    // ----------------------------
    // DISPLAY MESSAGE
    // ----------------------------

    function show(message){

        document.getElementById("message").innerHTML =
            message;

    }

    // -------------------------
    // detect account created
    // -------------------------
    
    supabaseClient.auth.onAuthStateChange((event, session) => {
    
        if (event === "SIGNED_IN") {
            show("Logged in as: " + session.user.email);
        }
    
    });

    //--------------------------
    // save profile details 
    //--------------------------
    async function saveProfile(){

    const user = await supabaseClient.auth.getUser();

    const id = user.data.user.id;

    const name =
        document.getElementById("name").value;

    const institution =
        document.getElementById("institution").value;

    const {error} = await supabaseClient
        .from("researchers")
        .update({
            name: name,
            institution: institution,
        })
        .eq("id", id);


    if(error){
        show(error.message);
    }
    else{
        show("Profile saved!");
    }

}
</script>


</body>
</html>
